<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dazed CEGs - GOM</title>
<link rel="icon" type="image/png" href="../imagens/favicon-icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Josefin+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("dazedcegs_gom_tema")==="escuro")document.documentElement.setAttribute("data-tema","escuro")}catch(e){}</script>
<style>
:root{
  --bg:#E8EFF6; --band:#F1F1F7; --surface:#FFFFFF; --ink:#2B2B33; --muted:#5C6270; --line:rgba(43,43,51,0.10); --field-line:rgba(43,43,51,0.28);
  --primary:#565780; --primary-ink:#4B5078; --on-primary:#FFFFFF; --link:#565780;
  --tint:#F1F1F7; --tint-ink:#4B5078; --track:#E4E6EE;
  --ok-bg:#E1F0E8; --ok-ink:#2A6B4C; --ok-ink2:#2A6B4C;
  --warn-bg:#FBEFD8; --warn-ink:#8A6418; --gray-bg:#F1F1F7; --gray-ink:#5C6270;
  --bad-bg:#FFE3E5; --bad-ink:#C23440; --disabled-bg:#D9DCE6;
  --coral:#FF5460; --coral-dark:#C23440; --purple:#6F70A1; --purple-dark:#565780; --purple-tint:#F1F1F7;
  --shadow:rgba(43,43,51,0.35);
  --foco:#4B5BAD; --nav-bg:#FFFFFF; --nav-linha:#E5E7EB; --nav-txt:#4A5070; --nav-forte:#1F2340; --acento:#4B5BAD; --titulo:#4B5078; --menu-txt:#4A5070;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Poppins','Outfit','Nunito','Inter',-apple-system,sans-serif}
body{font-size:14.5px;line-height:1.55}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}

/* ───── NAVBAR (igual à do site) ───── */
.nav{position:sticky;top:0;z-index:30;background:var(--nav-bg);border-bottom:1px solid var(--nav-linha);display:flex;align-items:center;padding:0 32px;height:64px;gap:0}
.nav-logo{position:absolute;left:32px;display:flex;align-items:center;line-height:1}
.nav-logo img{height:52px;width:auto;display:block}
.nav-links{margin:0 auto;display:flex;align-items:stretch;gap:0}
.nav-a{display:flex;align-items:center;gap:6px;padding:0 18px;height:64px;font-family:'Poppins','Outfit','Nunito','Inter',sans-serif;font-size:13.5px;font-weight:500;color:var(--nav-txt);border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;position:relative}
.nav-a svg{width:16px;height:16px;stroke:var(--nav-txt);fill:none;flex-shrink:0}
.nav-a:hover{color:var(--nav-forte)}
.nav-a.active{color:var(--nav-forte);font-weight:600;border-bottom-color:var(--acento)}
.nav-a.active svg{stroke:var(--nav-forte)}
/* com 7 abas, os nomes ocupam mais espaço: em telas menores mostra só os ícones (antes o corte era 1080px) */
@media(max-width:1244px){.nav-a span{display:none}}
@media(max-width:680px){.nav{padding:0 16px}.nav-logo{left:16px}.nav-a{padding:0 10px}}
/* celular: ícones colados à direita, para os 7 caberem sem encostar no logo (igual às outras páginas do site) */
@media(max-width:480px){.nav-links{margin:0 0 0 auto}}
@media(max-width:389px){.nav-a{padding:0 8px}}
@media(max-width:359px){.nav-a{padding:0 6px}}

/* ───── página ───── */
.g-main{max-width:1280px;margin:0 auto;padding:36px 32px 90px}
@media(max-width:680px){.g-main{padding:24px 16px 72px}}
.g-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--purple);background:var(--purple-tint);padding:6px 14px;border-radius:999px;margin-bottom:14px;font-weight:600}
.g-muted{color:var(--muted)}
.g-link{color:var(--primary-ink);font-size:13px;font-weight:600;text-decoration:underline}

/* ───── campos e botões (padrão do site: pílulas) ───── */
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=date],input[type=time],input[type=tel],select{width:100%;height:44px;padding:0 16px;border:1px solid var(--field-line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px}
textarea{width:100%;min-height:96px;padding:12px 16px;border:1px solid var(--field-line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:13.5px;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(111,112,161,.15)}
input[type=checkbox],input[type=radio]{accent-color:var(--purple)}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13px;letter-spacing:.2px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.g-btn:hover{background:var(--tint)}
.g-btn.primario{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(255,84,96,.3)}
.g-btn.primario:hover{background:var(--coral-dark);border-color:var(--coral-dark);transform:scale(1.03);box-shadow:0 6px 18px rgba(255,84,96,.38)}
.g-btn.cheio{width:100%}
.g-btn[disabled]{background:var(--disabled-bg);border-color:var(--disabled-bg);color:var(--gray-ink);cursor:not-allowed;box-shadow:none;transform:none}
.g-chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--gray-bg);color:var(--gray-ink);white-space:nowrap}
.g-chip.violeta{background:var(--tint);color:var(--primary-ink)}

/* ───── entrada GOM ───── */
.g-cab{margin-bottom:24px}
.g-cab h1{margin:0 0 8px}
.g-cab p{margin:0 auto;color:var(--muted);font-size:14px;max-width:560px}
.g-login{min-height:calc(100vh - 190px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.g-entrada{display:flex;justify-content:center;width:100%}
.g-entrada .g-card{width:100%;max-width:440px;text-align:left}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 1px 3px rgba(43,43,51,.04);display:flex;flex-direction:column;gap:16px}
.g-card h2{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
.g-card p{margin:0;color:var(--muted);font-size:13.5px}
.g-form{display:flex;flex-direction:column;gap:16px}
.g-campo{display:flex;flex-direction:column;gap:6px}
.g-campo label{font-size:12.5px;font-weight:600;color:var(--muted)}
.g-atalhos{display:flex;flex-direction:column;gap:10px}
.g-card p.g-erro{margin:0;color:var(--coral-dark);font-size:13px;font-weight:600}

/* ───── títulos do painel (mesmo estilo das páginas do site) ───── */
#app h1{font-family:'Note Book','Oswald',sans-serif!important;font-size:28px!important;font-weight:700!important;line-height:1.2!important;letter-spacing:0!important;color:var(--titulo)!important}

/* ───── ajustes das telas para o padrão do site ───── */
#app button[style*="border-radius:8px"],#app a[style*="border-radius:8px"]{border-radius:999px!important}
#app button[style*="background:var(--primary)"],#app a[style*="background:var(--primary)"]{background:var(--coral)!important;border-color:var(--coral)!important;box-shadow:0 4px 14px rgba(255,84,96,.28);font-weight:600!important;letter-spacing:.2px}
#app button[style*="background:var(--primary)"]:hover{background:var(--coral-dark)!important}
#app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=hidden]),#app select{border-radius:999px!important}
#app textarea{border-radius:14px!important}
#app [style*="border-radius:10px"]{border-radius:14px!important}

/* ───── painel ───── */
.g-shell{display:flex;gap:24px;align-items:flex-start}
.g-side{flex:0 0 272px;position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(43,43,51,.04);display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 108px);overflow:auto}
.g-side-topo{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;font-weight:700;font-size:15px;color:var(--titulo)}
.g-menu-btn{display:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13px;cursor:pointer}
.g-lista{display:flex;flex-direction:column;gap:2px}
.g-lista a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:12px;font-size:13.5px;font-weight:500;color:var(--menu-txt);border-left:3px solid transparent}
.g-lista a:hover{background:var(--tint);color:var(--nav-forte)}
.g-lista a[aria-current=page]{background:var(--tint);color:var(--nav-forte);font-weight:600;border-left-color:var(--acento)}
.g-side-rodape{margin-top:8px;padding:14px 10px 4px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--muted)}
.g-side-rodape strong{color:var(--ink);font-size:14px}
.g-side-rodape a,.g-side-rodape button{background:none;border:0;padding:0;color:var(--primary-ink);text-decoration:underline;cursor:pointer;font-size:12.5px;min-height:28px}
.g-content{flex:1 1 0;min-width:0}
.g-content>main{padding:0!important;gap:24px!important}
.g-demo{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 16px;font-size:13px;margin-bottom:22px}
.g-real{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:10px 16px;font-size:13px;margin-bottom:22px}
.g-real button{background:none;border:0;padding:0;margin-left:6px;color:var(--primary-ink);text-decoration:underline;cursor:pointer;font:inherit}
.g-qr{display:flex;flex-direction:column;align-items:center;text-align:center;margin:14px 0}
.g-qr img{width:200px;height:200px;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line)}
.g-chave{display:inline-block;margin-top:4px;padding:4px 8px;border-radius:8px;background:var(--tint);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.06em;user-select:all;word-break:break-all}
.g-sem-perm{max-width:620px;margin:60px auto;text-align:center}
@media (max-width:900px){
  .g-shell{flex-direction:column;align-items:stretch;gap:16px}
  .g-side{position:static;flex-basis:auto;width:100%;max-height:none}
  .g-menu-btn{display:inline-flex;align-items:center}
  .g-lista,.g-side-rodape{display:none}
  .g-side.aberto .g-lista{display:flex}
  .g-side.aberto .g-side-rodape{display:block}
}

/* ───── janelas e avisos ───── */
.fundo-modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(43,43,51,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.modal{width:100%;max-width:580px;background:var(--surface);color:var(--ink);border-radius:18px;padding:26px;margin:auto 0;box-shadow:0 20px 60px var(--shadow);display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:13.5px;max-width:min(560px,calc(100vw - 32px));z-index:60;box-shadow:0 8px 30px var(--shadow)}

/* ───── janelas de nova CEG e nova POB ───── */
.modal h2{margin:0;font-size:20px;color:var(--ink)}
.modal p.g-erro{margin:0;color:var(--coral-dark);font-size:13px;font-weight:600}
.g-acoes{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.g-rotulo{font-size:12.5px;font-weight:600;color:var(--muted)}
.g-check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink)}
.g-check input{width:20px;height:20px}

/* ───── abas da página Sets e claims e etiquetas de estado ───── */
.g-abas{display:flex;flex-wrap:wrap;gap:8px}
.g-aba{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s}
.g-aba:hover{background:var(--tint)}
.g-aba[aria-selected=true]{background:var(--tint);border-color:var(--acento);color:var(--nav-forte)}
.g-chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.g-chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.g-chip.bad{background:var(--bad-bg);color:var(--bad-ink)}

/* ───── modo noturno (o botão fica no fim de cada tela do painel) ───── */
html[data-tema="escuro"]{
  --bg:#12141C; --band:#262A3C; --surface:#1D2030; --ink:#ECEDF3; --muted:#A7ACC0; --line:rgba(255,255,255,0.10); --field-line:rgba(255,255,255,0.30);
  --primary:#9A9DDA; --primary-ink:#BFC1F2; --on-primary:#12141C; --link:#BFC1F2;
  --tint:#2A2F47; --tint-ink:#C9CBF5; --track:#353A55;
  --ok-bg:#16382A; --ok-ink:#7FD6A8; --ok-ink2:#7FD6A8;
  --warn-bg:#3B3116; --warn-ink:#F2C879; --gray-bg:#2A2E43; --gray-ink:#B8BCD0;
  --bad-bg:#47202A; --bad-ink:#FF9AA2; --disabled-bg:#3A3F57;
  --purple:#A9ABDF; --purple-dark:#9A9DDA; --purple-tint:#2A2F47;
  --shadow:rgba(0,0,0,0.65);
  --foco:#9EA1F0; --nav-bg:#1A1C28; --nav-linha:rgba(255,255,255,0.10); --nav-txt:#B5B9CE; --nav-forte:#FFFFFF; --acento:#9EA1F0; --titulo:#C9CBF5; --menu-txt:#B5B9CE;
  color-scheme:dark;
}
::placeholder{color:var(--muted);opacity:.75}
.g-fim{display:flex;align-items:center;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.g-switch{position:relative;flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:1px solid var(--field-line);background:var(--track);cursor:pointer;padding:0;transition:background .2s}
.g-switch-bola{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.g-switch[aria-checked=true]{background:var(--acento);border-color:var(--acento)}
.g-switch[aria-checked=true] .g-switch-bola{transform:translateX(20px)}

#app button[disabled]{opacity:.5;cursor:not-allowed}

/* ───── histórico da vaga (Masterlist) ───── */
.g-hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.g-hist li{display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:3px solid var(--acento);font-size:14px;color:var(--ink)}
.g-hist li span{font-size:13px;color:var(--muted)}


/* ───── Masterlist: POBs em sanfona, uma tabela por POB ───── */
.ml-resumo{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button.ml-fch{border:0;font-family:inherit;line-height:1.5;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
button.ml-fch:hover{box-shadow:inset 0 0 0 1px var(--muted)}
button.ml-fch[aria-pressed=true]{box-shadow:0 0 0 2px var(--acento)}
.ml-dica{font-size:13px}
.ml-lista{display:flex;flex-direction:column;gap:24px}
.ml-grupo{display:flex;flex-direction:column;gap:8px}
.ml-ceg{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;font-size:15px;font-weight:700;color:var(--muted)}
.ml-ceg .ml-meta{font-weight:400}
.ml-ferr{margin-left:auto;display:inline-flex;gap:4px}
.ml-lnk{background:none;border:0;padding:4px 8px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--primary-ink);cursor:pointer;text-decoration:underline}
.ml-lnk:hover{background:var(--tint)}
.ml-acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ml-pob{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;width:100%;padding:14px 20px;background:transparent;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ml-pob:hover{background:var(--tint)}
.ml-pob svg{flex:0 0 auto;color:var(--muted);transition:transform .15s ease}
.ml-pob[aria-expanded=true] svg{transform:rotate(90deg)}
.ml-nome{display:flex;flex-direction:column;gap:2px;min-width:200px}
.ml-nome strong{font-size:17px}
.ml-meta{font-size:13.5px;color:var(--muted)}
.ml-chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.ml-corpo{border-top:1px solid var(--line)}
.ml-rolagem{overflow-x:auto}
.ml-tabela{min-width:840px}
.ml-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px}
.ml-filtros{padding:18px 20px;gap:14px}
.ml-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.ml-campo{display:flex;flex-direction:column;gap:6px}
.ml-campo label{font-size:13px;font-weight:600;color:var(--muted)}
.ml-campo input,.ml-campo select{box-sizing:border-box;width:100%;min-height:44px;padding:0 12px;border:1px solid var(--field-line);border-radius:8px;font:inherit;background:var(--surface);color:var(--ink)}
.ml-btns{display:flex;flex-wrap:wrap;gap:12px}
.ml-barra{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--acento);border-radius:14px;background:var(--tint)}
.ml-barra-fixa{position:sticky;bottom:14px;z-index:6;box-shadow:0 8px 26px var(--shadow)}
.mlp-linha{display:grid;grid-template-columns:32px 52px minmax(80px,.9fr) minmax(170px,2.2fr) 78px 84px 50px minmax(170px,1.9fr);gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:13px}
.mlp-linha>[role=cell]{overflow-wrap:anywhere}
.mlp-cab{background:var(--band);font-size:13px;font-weight:600;color:var(--muted);border-top:0}
.mlp-set{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 16px;background:var(--tint);border-top:1px solid var(--line);font-size:14px}
.mlp-set strong{font-size:15px}
[data-mlp-row]{cursor:pointer}
[data-mlp-row]:hover{background:var(--tint)}
[data-mlp-row]:focus-visible{outline-offset:-2px}
.mlp-check{width:20px;height:20px;accent-color:var(--primary)}
#app select.mlp-sel{box-sizing:border-box;width:100%;height:30px;min-height:0;padding:0 6px 0 10px;border:1px solid var(--field-line);border-radius:8px!important;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;line-height:1.2}
.mlp-linha strong{line-height:1.35}
.mlp-linha .ml-meta{font-size:12.5px;line-height:1.3}
.ml-joiner{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.ml-stat{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}

/* ───── Sets e Claims: aba Criar sets mais leve (resumo de uma linha + "Mudar") e aba Editar com ações recolhidas ───── */
.cs-painel{display:flex;flex-direction:column;gap:20px}
.cs-painel[hidden],.cs-det-corpo[hidden],.cs-novo-membro[hidden],.cs-erro[hidden]{display:none!important}
.cs-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px}
.cs-cab h2{margin:0;font-size:20px;letter-spacing:-0.01em}
.cs-cab p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.cs-linha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 170px;gap:16px;align-items:end}
.cs-campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.cs-campo label{font-size:13px;font-weight:600;color:var(--muted)}
.cs-novos{display:flex;flex-wrap:wrap;gap:0 20px;margin-top:-8px}
.cs-link{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 4px;background:none;border:0;border-radius:8px;font:inherit;font-size:13.5px;font-weight:600;color:var(--primary-ink);cursor:pointer}
.cs-link:hover{background:var(--tint)}
.cs-dets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cs-det{border-bottom:1px solid var(--line)}

.cs-mudar{min-height:40px;min-width:76px;padding:0 16px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}

.cs-det-corpo{display:flex;flex-direction:column;gap:14px;padding:2px 0 18px}
.cs-chips{display:flex;flex-wrap:wrap;gap:8px}

.cs-chip button{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--primary-ink);padding:0;cursor:pointer}
.cs-chip button:hover{background:rgba(75,80,120,.14)}
.cs-add{min-height:40px;padding:0 16px;border-radius:999px;border:1px dashed var(--primary);background:var(--surface);color:var(--primary-ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.cs-add:hover{background:var(--tint)}
.cs-novo-membro{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:520px}
.cs-novo-membro .cs-campo{flex:1 1 220px}
.cs-erro{margin:0;flex:1 0 100%;color:var(--coral-dark);font-size:13px;font-weight:600}
.cs-nota{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.cs-valores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.cs-check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.cs-check input{width:22px;height:22px;flex:0 0 auto}
.cs-resumo{padding:14px 16px;border-radius:12px;background:var(--band);font-size:15px;line-height:1.6}
.cs-acoes{display:flex;flex-wrap:wrap;gap:12px}
.cs-info{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 20px}
.cs-info summary{display:flex;align-items:center;min-height:50px;cursor:pointer;font-size:14px;font-weight:600;color:var(--primary-ink)}
.cs-info p{margin:0 0 16px;font-size:14px;line-height:1.6;color:var(--muted)}
.cs-acao{border-top:1px solid var(--line)}
.cs-acao summary{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-height:50px;cursor:pointer;font-size:15px;font-weight:600}
.cs-acao-corpo{display:flex;flex-direction:column;gap:12px;padding:2px 0 16px}
.cs-info summary,.cs-acao summary{list-style:none}
.cs-info summary::-webkit-details-marker,.cs-acao summary::-webkit-details-marker{display:none}
.cs-info summary::after,.cs-acao summary::after{content:'';flex:0 0 auto;margin:-4px 4px 0 auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s ease}
.cs-info[open] summary::after,.cs-acao[open] summary::after{margin-top:4px;transform:rotate(-135deg)}
.cs-info summary:hover,.cs-acao summary:hover{color:var(--ink)}
@media (max-width:700px){
  .cs-card{padding:18px}
  .cs-linha{grid-template-columns:minmax(0,1fr)}
  .cs-det-resumo{grid-template-columns:minmax(0,1fr) auto}
  .cs-det-txt{grid-column:1 / -1;order:3}
  .cs-acoes .g-btn{flex:1 1 100%}
}

<script>
(function () {

el><select id=\"ml-novo\" class=\"mlp-sel\" style=\"width:auto;min-width:220px\"><\/select><button type=\"button\" class=\"g-btn primario\" data-acao=\"ml-aplicar\">Aplicar<\/button><button type=\"button\" class=\"g-btn\" data-acao=\"ml-limpar-sel\">Limpar seleção<\/button><\/div><\/main>"};

        erro + '<button class="g-btn primario cheio" type="submit">Entrar</button></form>' +
        (SB ? '' : '<p class="g-erro" role="alert">O login ainda não está configurado nesta página.</p>') + '</section>';
    } else if (passoLogin === 2) {
      card = '<section class="g-card" aria-label="Verificação em duas etapas"><div><span class="g-chip violeta">Passo 2</span><h2 style="margin-top:8px">Verificação em duas etapas</h2>' +

        '<form id="form-gom-2" class="g-form"><div class="g-campo"><label for="g-codigo">Código de 6 dígitos</label><input id="g-codigo" type="text" inputmode="numeric" maxlength="8" placeholder="000000" autocomplete="one-time-code"></div>' +

  /* ------------------------------------------------ painel */
const NAV = [
    { k: 'inicio', t: 'Início', p: 'TODOS' },
    { k: 'masterlist', t: 'Masterlist', p: 'TODOS' }
  ];
  const PERSONAS = {

      toast('Pedido cancelado. Os itens voltaram para “Liberado envio nacional”.');
    }
  }



  /* ------------------------------------------------ rotas */
  let ROTA = '/gom';
  try { if (location.hash && location.hash.length > 1) ROTA = location.hash.slice(1); } catch (e) { /* ignora */ }
  const rota = () => ROTA.split('/').filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const marcarEndereco = () => { try { if (location.hash !== '#' + ROTA) history.replaceState(null, '', '#' + ROTA); } catch (e) { /* ignora */ } };
  /* endereços antigos continuam funcionando e levam para a tela nova */
  const ALIAS = { 'criar-sets': ['sets', 'criar'], 'claims': ['sets', 'anotar'], 'claims-editar': ['sets', 'editar'], 'prazo-multa': ['sets', 'criar'], 'frete-lancar': ['importar'] };
  function trocarAba(nome, tela) {
    const raiz = $('.g-content'); if (!raiz) return;
    const dela = (el) => (el.getAttribute('data-tela') || 'sets') === tela;
    $$('.g-aba', raiz).filter(dela).forEach((b) => b.setAttribute('aria-selected', b.getAttribute('data-aba') === nome ? 'true' : 'false'));
    $$('[data-painel]', raiz).filter(dela).forEach((x) => { x.hidden = x.getAttribute('data-painel') !== nome; });
    ROTA = '/painel/' + tela + '/' + nome; marcarEndereco();
  }
  function ir(caminho) { ROTA = String(caminho || '/gom').replace(/^#/, '') || '/gom'; render(); }
  /* ------------------------------------------------ Liberar pagamento (demonstração): o resumo acompanha as caixinhas marcadas */
  function ligarLiberar() {
    const tabela = $('[aria-label="Sets para liberar"]'); const resumo = $('[aria-label="Resumo da liberação"]');
    if (!tabela || !resumo) return;
    const h = resumo.querySelector('h2'); const txt = resumo.querySelector('p'); const btn = resumo.querySelectorAll('button')[1];
    const dinheiro = (n) => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const num = (s) => parseFloat(String(s).replace(/\./g, '').replace(',', '.')) || 0;
    const plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
    const atualizar = () => {
      const marcadas = Array.from(tabela.querySelectorAll('input[type="checkbox"]')).filter((c) => c.checked && !c.disabled);
      const n = marcadas.length;
      if (!n) {
        h.textContent = 'Nenhum set escolhido';
        txt.textContent = 'Marque os sets em revisão que você quer liberar para pagamento.';
        btn.textContent = 'Liberar sets'; btn.disabled = true; btn.classList.add('lib-off');
        return;
      }
      let claims = 0; let total = 0; const prazos = []; const multas = [];
      marcadas.forEach((c) => {
        const cel = c.closest('[role="row"]').querySelectorAll('[role="cell"]');
        claims += parseInt(cel[2].textContent, 10) || 0;
        const v = cel[3].textContent.match(/R\$\s*([\d.]+,\d{2})/); total += v ? num(v[1]) : 0;
        const pz = (cel[4].textContent.match(/\d{1,2}\/\d{1,2}/) || ['sem prazo'])[0];
        const f = prazos.find((x) => x.d === pz); if (f) f.n += 1; else prazos.push({ d: pz, n: 1 });
        const m = cel[4].textContent.match(/R\$\s*([\d.]+,\d{2})/); if (m && multas.indexOf(m[1]) === -1) multas.push(m[1]);
      });
      prazos.sort((a, b) => b.n - a.n);
      const lista = prazos.map((x) => x.d + ' (' + plural(x.n, 'set', 'sets') + ')');
      const prazosTxt = lista.length > 1 ? lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1] : lista[0];
      const multaTxt = multas.length === 1 ? 'com multa de R$ ' + multas[0] + ' por dia depois do prazo' : 'com multas diferentes por set';
      h.textContent = 'Você vai liberar ' + plural(n, 'set', 'sets');
      txt.textContent = plural(claims, 'claim', 'claims') + ', no valor total de ' + dinheiro(total) + '. Prazos em ' + prazosTxt + ', ' + multaTxt + '.';
      btn.textContent = 'Liberar ' + plural(n, 'set', 'sets'); btn.disabled = false; btn.classList.remove('lib-off');
    };
    tabela.addEventListener('change', atualizar);
    atualizar();
  }

  function render() {
    fecharModal();
    const p = rota(); let html = ''; let titulo = 'Dazed CEGs - GOM';
    if (p[0] === 'painel') {
      if (!S.sessao) { ROTA = '/gom'; return render(); }
      if (!p[1]) { ROTA = '/painel/' + telaInicial(S.sessao); return render(); }
      if (ALIAS[p[1]]) { ROTA = '/painel/' + ALIAS[p[1]].join('/'); return render(); }
      html = viewPainel(p[1], p[2]); titulo = 'Dazed CEGs - Painel de controle';
    } else {
      if (S.sessao) { ROTA = '/painel/' + telaInicial(S.sessao); return render(); }
      html = viewGom();
    }
    app.innerHTML = html;
    if (passoLogin === 3 && FATOR && $('#g-qr')) { try { $('#g-qr').src = FATOR.qr; } catch (e) { /* ignora */ } }
    document.title = titulo;
    if (p[1] === 'sets' || p[1] === 'frete' || p[1] === 'envios') { const sel = $('.g-aba[aria-selected="true"]'); if (sel) ROTA = '/painel/' + p[1] + '/' + sel.getAttribute('data-aba'); }
    marcarEndereco();
    const subir = () => { try { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (e) { /* ignora */ } };
    subir(); requestAnimationFrame(subir); setTimeout(subir, 80);
    if (p[0] === 'painel') { if (p[1] === 'permissoes') ligarPermissoes(); if (p[1] === 'sets') ligarCriarSets(); if (p[1] === 'usuarios') ligarUsuarios(); if (p[1] === 'envios') ligarEnvios(); if (p[1] === 'masterlist') ligarMasterlist(p[2]); if (p[1] === 'importar') ligarImportar(); if (p[1] === 'fotos') ligarFotos(); if (p[1] === 'liberar') ligarLiberar(); }
  }

  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#/"]');
    if (link) { e.preventDefault(); ir(link.getAttribute('href').slice(1)); return; }
    const linhaML = e.target.closest('[data-mlp-row]');
    if (linhaML && !e.target.closest('input,select,label,button,a')) { abrirHistoricoVaga(linhaML.getAttribute('data-id')); return; }
    const a = e.target.closest('[data-acao]');
    if (a) {
      const acao = a.getAttribute('data-acao');
      if (acao === 'fechar') fecharModal();
      else if (acao === 'menu') { const l = $('#lado'); if (l) { l.classList.toggle('aberto'); a.setAttribute('aria-expanded', l.classList.contains('aberto') ? 'true' : 'false'); } }
      else if (acao === 'tema') aplicarTema(!temaEscuro(), true);
      else if (acao.indexOf('env-') === 0) acaoEnvios(acao, a.getAttribute('data-id'));
      else if (acao === 'ml-limpar') limparML();
      else if (acao === 'ml-baixar') baixarPlanilhaML();
      else if (acao === 'ml-abrir') alternarPobML(a.getAttribute('data-id'));
      else if (acao === 'ml-chip') { const est = a.getAttribute('data-estado'); filtroML.status = filtroML.status === est ? '' : est; const ss = $('#ml-status'); if (ss) ss.value = filtroML.status; refiltrar(); }
      else if (acao === 'ml-abrir-todos') abrirFecharTodosML(a.getAttribute('data-ceg'), true);
      else if (acao === 'ml-fechar-todos') abrirFecharTodosML(a.getAttribute('data-ceg'), false);
      else if (acao === 'ml-aplicar') aplicarLoteML();
      else if (acao === 'ml-limpar-sel') { mlpSel.clear(); desenharML(); }
      else if (acao === 'imp-escolher') { const ii = $('#imp-arquivo'); if (ii) ii.click(); }
      else if (acao === 'imp-carregar') carregarImp();
      else if (acao === 'imp-avisos') baixarAvisosImp();
      else if (acao === 'imp-modelo') baixarModeloImp();
      else if (acao === 'cs-mudar') alternarDetCS(a);
      else if (acao === 'cs-add-membro') abrirNovoMembroCS();
      else if (acao === 'cs-incluir-membro') incluirMembroCS();
      else if (acao === 'cs-rem-membro') removerMembroCS(a);
      else if (acao === 'aba') trocarAba(a.getAttribute('data-aba'), a.getAttribute('data-tela') || 'sets');
      else if (acao === 'sair') { sairReal().then(() => { S.sessao = null; salvar(); passoLogin = 1; ir('/gom'); }); }
      else if (acao === 'recarregar') { a.disabled = true; carregarDoBanco().then(() => { toast('Dados atualizados.'); render(); }).catch((err) => { toast('Não consegui atualizar: ' + traduzErro(err)); a.disabled = false; }); }
      return;
    }
    const b = e.target.closest('button');
    if (b && !b.disabled && (b.closest('.g-content') || b.closest('.fundo-modal'))) {
      if (b.closest('.fundo-modal') && b.hasAttribute('data-acao')) return;
      botaoPainel(b);
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target && e.target.matches && e.target.matches('[data-mlp-row]')) { e.preventDefault(); abrirHistoricoVaga(e.target.getAttribute('data-id')); } });
  const erroLogin = (msg) => { const m = $('#g-erro'); if (m) { m.textContent = msg; m.hidden = false; } };
  /* ------------------------------------------------ VERSÃO REAL, etapa 1: login no Supabase (senha + código do autenticador) e leitura da POBS D:U.
     Só leitura: nada nesta página grava no banco. O cadeado do banco (RLS) só deixa ler quem está na lista de GOMs e entrou com o código. */
  const CFG = window.GOM_CONFIG || {};
  let SB = null;
  try { if (window.supabase && CFG.url && CFG.key) SB = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false } }); } catch (e) { SB = null; }
  const CEG_REAL = 'POBS D:U';
  const TABELA_REAL = 'ceg_du_yzy_shanghai_pobs';
  const COLUNAS_REAL = 'id,pob,membro,joiner_nome,joiner_handle,telefone_final,valor,prazo,pagamento,status,linha_planilha,set_numero,avulso,posicao';
  const CARGA = { quando: null, total: 0 };
  let FATOR = null;       /* código do autenticador em cadastro (primeiro acesso) */
  let CARREGANDO = '';    /* texto do cartão do login enquanto algo demora */

  function traduzErro(err) {
    const m = String((err && (err.message || err.error_description)) || '').toLowerCase(); const c = String((err && (err.code || err.error_code)) || '').toLowerCase();
    if (c === 'invalid_credentials' || m.indexOf('invalid login') >= 0) return 'E-mail ou senha incorretos.';
    if (c === 'email_not_confirmed') return 'Este e-mail ainda não foi confirmado.';
    if (c === 'mfa_verification_failed' || c === 'mfa_challenge_expired' || m.indexOf('invalid totp') >= 0 || m.indexOf('invalid code') >= 0) return 'Código incorreto ou vencido. Espere o próximo código do aplicativo e tente de novo.';
    if (c === 'over_request_rate_limit' || m.indexOf('rate limit') >= 0 || (err && err.status === 429)) return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
    if (m.indexOf('failed to fetch') >= 0 || m.indexOf('network') >= 0) return 'Sem conexão com o servidor. Confira a internet e tente de novo.';
    return 'Não foi possível concluir agora. Tente de novo em instantes.';
  }

  /* ---- ler as vagas do banco (1.000 por vez) e montar as mesmas vagas que o importador monta ---- */
  async function lerVagasDoBanco() {
    const todas = []; const tam = 1000;
    for (let ini = 0; ; ini += tam) {
      const r = await SB.from(TABELA_REAL).select(COLUNAS_REAL).order('linha_planilha', { ascending: true }).range(ini, ini + tam - 1);
      if (r.error) throw r.error;
      (r.data || []).forEach((x) => todas.push(x));
      if (!r.data || r.data.length < tam) break;
    }
    return todas;
  }
  function vagasDeLinhas(linhas, agora) {
    return linhas.map((r) => {
      const dono = !!(r.joiner_handle || r.joiner_nome);
      let prazo = '—'; let passou = false;
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(r.prazo || '');
      if (m) { prazo = m[3] + '/' + m[2]; passou = new Date(+m[1], +m[2] - 1, +m[3], 23, 59) < agora; }   /* com o ano de verdade: jan/fev de 2027 não contam como passado */
      const sit = r.pagamento === true ? 'Paga' : (!dono ? 'Livre' : (passou ? 'Em atraso' : 'Liberada'));
      const envio = r.status || (sit === 'Paga' ? 'Pago' : '—');
      return { id: 'b' + r.id, ceg: CEG_REAL, pob: r.pob, set: r.avulso ? 0 : (r.set_numero || 0), avulso: r.avulso === true, membro: r.posicao, membroNome: r.membro || '', handle: r.joiner_handle ? '@' + r.joiner_handle : '', nome: r.joiner_nome || '', final: r.telefone_final || '', valor: r.valor === null || r.valor === undefined ? 0 : Number(r.valor), prazo, sit, envio, envio0: envio, extra: [], origem: 'banco', linha: r.linha_planilha, statusOrig: r.status || '', pagoOrig: r.pagamento === true, importadaEm: '', multa: '' };
    });
  }
  async function carregarDoBanco() {
    const linhas = await lerVagasDoBanco();
    const agora = new Date();
    ML.length = 0;
    carregarCegNaMasterlist(vagasDeLinhas(linhas, agora), CEG_REAL);
    CARGA.quando = agora; CARGA.total = linhas.length;
    montarInicioReal();
  }
  const hhmm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const avisoReal = () => (CARGA.total ? 'Dados reais da ' + CEG_REAL + ', lidos do banco' + (CARGA.quando ? ' às ' + hhmm(CARGA.quando) : '') + '. Somente leitura: nada aqui grava no banco.' : 'O banco não devolveu nenhuma vaga. Se isto não é esperado, avise quem cuida do sistema.') + ' <button type="button" data-acao="recarregar">Atualizar agora</button>';
  function montarInicioReal() {
    const c = contarML(ML);
    const chip = (t, cls) => '<span class="g-chip' + (cls ? ' ' + cls : '') + '">' + t + '</span>';
    const pobs = new Set(ML.map((v) => v.pob)).size; const pessoas = new Set(ML.filter((v) => v.handle).map((v) => v.handle)).size;
    FRAG.inicio = '<main style="flex:999 1 560px;min-width:0;padding:36px 44px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">' +
      '<header><h1 style="margin:0;font-size:30px;line-height:1.15;letter-spacing:-0.02em">Início</h1><p class="g-muted" style="margin:8px 0 0">' + esc(CEG_REAL) + ': ' + plm(pobs, 'POB', 'POBs') + ', ' + plm(ML.length, 'vaga', 'vagas') + ' e ' + plm(pessoas, 'pessoa', 'pessoas') + '.</p></header>' +
      '<section class="g-card" aria-label="Situação das vagas"><div><h2>Situação das vagas</h2></div><div class="ml-resumo">' +
      ESTADOS_ML.filter((e) => c[e]).map((e) => chip(plm(c[e], ROTULO_ESTADO[e][0], ROTULO_ESTADO[e][1]), CLASSE_ESTADO[e])).join('') + '</div>' +
      '<p><a class="g-btn primario" href="#/painel/masterlist">Abrir a Masterlist</a></p></section></main>';
  }

  /* ---- entrar: senha, depois o código do autenticador (no primeiro acesso, ligar o código antes) ---- */
  async function sairReal() { try { if (SB) await SB.auth.signOut(); } catch (e) { /* ignora */ } ML.length = 0; reconstruirPobsML(); CARGA.quando = null; CARGA.total = 0; FATOR = null; CARREGANDO = ''; }
  async function entrarSenha(email, senha) {
    if (!SB) return erroLogin('O login ainda não está configurado nesta página.');
    const btn = $('#form-gom-1 button[type="submit"]'); if (btn) btn.disabled = true;
    try {
      const r = await SB.auth.signInWithPassword({ email, password: senha });
      if (r.error) { erroLogin(traduzErro(r.error)); return; }
      emailLogin = email;
      const a = await SB.auth.mfa.getAuthenticatorAssuranceLevel();
      if (a.error || !a.data) { await sairReal(); passoLogin = 1; render(); erroLogin(traduzErro(a.error)); return; }
      if (a.data.currentLevel === 'aal2') { await concluirLogin(); return; }
      passoLogin = a.data.nextLevel === 'aal2' ? 2 : 3; FATOR = null; render();
      if (passoLogin === 3) iniciarCadastroCodigo();
    } catch (e) { erroLogin(traduzErro(e)); } finally { if (btn) btn.disabled = false; }
  }
  /* O banco devolve o QR como imagem SVG dentro de um endereço "data:". Se o SVG vier "cru" (com # nas cores e < >), o navegador corta o endereço no #
     e a imagem não aparece. Aqui o SVG cru é codificado; se já vier codificado ou em base64, passa como está. */
  function qrSeguro(uri) {
    const s = String(uri || ''); const i = s.indexOf(',');
    if (!/^data:image\/svg\+xml/i.test(s) || i < 0 || /;base64/i.test(s.slice(0, i))) return s;
    const corpo = s.slice(i + 1);
    return /^\s*</.test(corpo) ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(corpo) : s;
  }
  async function iniciarCadastroCodigo() {
    try {
      const lf = await SB.auth.mfa.listFactors();
      const sobras = ((lf.data && lf.data.all) || []).filter((f) => f.factor_type === 'totp' && f.status !== 'verified');
      for (const f of sobras) { await SB.auth.mfa.unenroll({ factorId: f.id }); }   /* tentativas antigas que ficaram sem confirmar */
      const r = await SB.auth.mfa.enroll({ factorType: 'totp', issuer: 'DAZED CEGs', friendlyName: 'Autenticador ' + new Date().toLocaleString('sv-SE').slice(0, 16) });   /* issuer = o nome que aparece no aplicativo do celular */
      if (r.error || !r.data) { erroLogin(traduzErro(r.error)); return; }
      FATOR = { id: r.data.id, qr: qrSeguro(r.data.totp.qr_code), chave: r.data.totp.secret };
      render();
    } catch (e) { erroLogin(traduzErro(e)); }
  }
  async function confirmarCodigo(codigo, cadastro) {
    const btn = $('#g-codigo') && $('#g-codigo').form ? $('#g-codigo').form.querySelector('button[type="submit"]') : null; if (btn) btn.disabled = true;
    try {
      let fid = null;
      if (cadastro) fid = FATOR && FATOR.id;
      else { const lf = await SB.auth.mfa.listFactors(); const f = ((lf.data && lf.data.totp) || [])[0]; fid = f && f.id; }
      if (!fid) { erroLogin('Não achei o código ligado a esta conta. Saia e entre de novo.'); return; }
      const v = await SB.auth.mfa.challengeAndVerify({ factorId: fid, code: codigo });
      if (v.error) { erroLogin(traduzErro(v.error)); return; }
      FATOR = null;
      await concluirLogin();
    } catch (e) { erroLogin(traduzErro(e)); } finally { if (btn) btn.disabled = false; }
  }
  async function concluirLogin() {
    const falha = async (msg) => { await sairReal(); passoLogin = 1; render(); erroLogin(msg); };
    try {
      const a = await SB.auth.mfa.getAuthenticatorAssuranceLevel();
      if (!a.data || a.data.currentLevel !== 'aal2') return falha('A verificação em duas etapas não foi concluída. Entre de novo.');
      const u = await SB.from('gom_usuarios').select('papel,ativo').maybeSingle();
      if (u.error || !u.data || u.data.ativo !== true) return falha('Esta conta não está liberada para a área das GOMs.');
      if (u.data.papel !== 'dona') return falha('O acesso das ADMs ainda não foi liberado nesta página.');
      CARREGANDO = 'Carregando as vagas da ' + CEG_REAL; render();
      await carregarDoBanco();
      CARREGANDO = ''; S.sessao = 'admin'; passoLogin = 1; ir('/painel/' + telaInicial(S.sessao));
    } catch (e) { await falha('Entrou, mas não consegui ler as vagas: ' + traduzErro(e)); }
  }
  document.addEventListener('submit', (e) => {
    const f = e.target;
    if (!f || !f.id) return;
    e.preventDefault();
    if (f.id === 'form-gom-1') {
      const mail = ($('#g-email').value || '').trim().toLowerCase(); const senha = $('#g-senha').value || '';
      if (!mail || !senha) return erroLogin('Digite o e-mail e a senha.');
      entrarSenha(mail, senha);
    } else if (f.id === 'form-gom-2' || f.id === 'form-gom-3') {
      const cod = ($('#g-codigo').value || '').replace(/\s+/g, '');
      if (!/^\d{6}$/.test(cod)) return erroLogin('Digite os 6 números do código.');
      confirmarCodigo(cod, f.id === 'form-gom-3');
    }
  });
  window.__real = { sairReal, carregarDoBanco, get sessao() { return S.sessao; } };   /* ganchos de leitura para os testes */

  window.__ir = ir; window.__rota = () => ROTA;

  render();
})();
