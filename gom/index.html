<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dazed CEGs - GOM</title>
<link rel="icon" type="image/png" href="../imagens/favicon-icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Josefin+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("dazedcegs_gom_tema")==="escuro")document.documentElement.setAttribute("data-tema","escuro")}catch(e){}</script>
<style>
:root{
  --bg:#E8EFF6; --band:#F1F1F7; --surface:#FFFFFF; --ink:#2B2B33; --muted:#5C6270; --line:rgba(43,43,51,0.10); --field-line:rgba(43,43,51,0.28);
  --primary:#565780; --primary-ink:#4B5078; --on-primary:#FFFFFF; --link:#565780;
  --tint:#F1F1F7; --tint-ink:#4B5078; --track:#E4E6EE;
  --ok-bg:#E1F0E8; --ok-ink:#2A6B4C; --ok-ink2:#2A6B4C;
  --warn-bg:#FBEFD8; --warn-ink:#8A6418; --gray-bg:#F1F1F7; --gray-ink:#5C6270;
  --bad-bg:#FFE3E5; --bad-ink:#C23440; --disabled-bg:#D9DCE6;
  --coral:#FF5460; --coral-dark:#C23440; --purple:#6F70A1; --purple-dark:#565780; --purple-tint:#F1F1F7;
  --shadow:rgba(43,43,51,0.35);
  --foco:#4B5BAD; --nav-bg:#FFFFFF; --nav-linha:#E5E7EB; --nav-txt:#4A5070; --nav-forte:#1F2340; --acento:#4B5BAD; --titulo:#4B5078; --menu-txt:#4A5070;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Poppins','Outfit','Nunito','Inter',-apple-system,sans-serif}
body{font-size:14.5px;line-height:1.55}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}

/* ───── NAVBAR (igual à do site) ───── */
.nav{position:sticky;top:0;z-index:30;background:var(--nav-bg);border-bottom:1px solid var(--nav-linha);display:flex;align-items:center;padding:0 32px;height:64px;gap:0}
.nav-logo{position:absolute;left:32px;display:flex;align-items:center;line-height:1}
.nav-logo img{height:52px;width:auto;display:block}
.nav-links{margin:0 auto;display:flex;align-items:stretch;gap:0}
.nav-a{display:flex;align-items:center;gap:6px;padding:0 18px;height:64px;font-family:'Poppins','Outfit','Nunito','Inter',sans-serif;font-size:13.5px;font-weight:500;color:var(--nav-txt);border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;position:relative}
.nav-a svg{width:16px;height:16px;stroke:var(--nav-txt);fill:none;flex-shrink:0}
.nav-a:hover{color:var(--nav-forte)}
.nav-a.active{color:var(--nav-forte);font-weight:600;border-bottom-color:var(--acento)}
.nav-a.active svg{stroke:var(--nav-forte)}
/* com 8 itens (antes eram 7), os nomes ocupam mais espaço: aperta o respiro entre os itens e, em telas menores, mostra só os ícones (antes o corte era 1080px) */
@media(max-width:1340px){.nav-a{padding:0 12px}}
@media(max-width:1244px){.nav-a{padding:0 18px}.nav-a span{display:none}}
/* celular: logo menor e ícones colados à direita, para os 8 caberem sem encostar no logo */
@media(max-width:680px){.nav{padding:0 12px}.nav-logo{left:12px}.nav-logo img{height:40px}.nav-links{margin:0 0 0 auto}.nav-a{padding:0 8px}}
@media(max-width:359px){.nav-logo img{height:32px}.nav-a{padding:0 6px}}

/* ───── página ───── */
.g-main{max-width:1280px;margin:0 auto;padding:36px 32px 90px}
@media(max-width:680px){.g-main{padding:24px 16px 72px}}
.g-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--purple);background:var(--purple-tint);padding:6px 14px;border-radius:999px;margin-bottom:14px;font-weight:600}
.g-muted{color:var(--muted)}
.g-link{color:var(--primary-ink);font-size:13px;font-weight:600;text-decoration:underline}

/* ───── campos e botões (padrão do site: pílulas) ───── */
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=date],input[type=time],input[type=tel],select{width:100%;height:44px;padding:0 16px;border:1px solid var(--field-line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px}
textarea{width:100%;min-height:96px;padding:12px 16px;border:1px solid var(--field-line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:13.5px;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(111,112,161,.15)}
input[type=checkbox],input[type=radio]{accent-color:var(--purple)}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13px;letter-spacing:.2px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.g-btn:hover{background:var(--tint)}
.g-btn.primario{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(255,84,96,.3)}
.g-btn.primario:hover{background:var(--coral-dark);border-color:var(--coral-dark);transform:scale(1.03);box-shadow:0 6px 18px rgba(255,84,96,.38)}
.g-btn.cheio{width:100%}
.g-btn[disabled]{background:var(--disabled-bg);border-color:var(--disabled-bg);color:var(--gray-ink);cursor:not-allowed;box-shadow:none;transform:none}
.g-chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--gray-bg);color:var(--gray-ink);white-space:nowrap}
.g-chip.violeta{background:var(--tint);color:var(--primary-ink)}

/* ───── entrada GOM ───── */
.g-cab{margin-bottom:24px}
.g-cab h1{margin:0 0 8px}
.g-cab p{margin:0 auto;color:var(--muted);font-size:14px;max-width:560px}
.g-login{min-height:calc(100vh - 190px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.g-entrada{display:flex;justify-content:center;width:100%}
.g-entrada .g-card{width:100%;max-width:440px;text-align:left}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 1px 3px rgba(43,43,51,.04);display:flex;flex-direction:column;gap:16px}
.g-card h2{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
.g-card p{margin:0;color:var(--muted);font-size:13.5px}
.g-form{display:flex;flex-direction:column;gap:16px}
.g-campo{display:flex;flex-direction:column;gap:6px}
.g-campo label{font-size:12.5px;font-weight:600;color:var(--muted)}
.g-atalhos{display:flex;flex-direction:column;gap:10px}
.g-card p.g-erro{margin:0;color:var(--coral-dark);font-size:13px;font-weight:600}

/* ───── títulos do painel (mesmo estilo das páginas do site) ───── */
#app h1{font-family:'Note Book','Oswald',sans-serif!important;font-size:28px!important;font-weight:700!important;line-height:1.2!important;letter-spacing:0!important;color:var(--titulo)!important}

/* ───── ajustes das telas para o padrão do site ───── */
#app button[style*="border-radius:8px"],#app a[style*="border-radius:8px"]{border-radius:999px!important}
#app button[style*="background:var(--primary)"],#app a[style*="background:var(--primary)"]{background:var(--coral)!important;border-color:var(--coral)!important;box-shadow:0 4px 14px rgba(255,84,96,.28);font-weight:600!important;letter-spacing:.2px}
#app button[style*="background:var(--primary)"]:hover{background:var(--coral-dark)!important}
#app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=hidden]),#app select{border-radius:999px!important}
#app textarea{border-radius:14px!important}
#app [style*="border-radius:10px"]{border-radius:14px!important}

/* ───── painel ───── */
.g-shell{display:flex;gap:24px;align-items:flex-start}
.g-side{flex:0 0 272px;position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(43,43,51,.04);display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 108px);overflow:auto}
.g-side-topo{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;font-weight:700;font-size:15px;color:var(--titulo)}
.g-menu-btn{display:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13px;cursor:pointer}
.g-lista{display:flex;flex-direction:column;gap:2px}
.g-lista a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:12px;font-size:13.5px;font-weight:500;color:var(--menu-txt);border-left:3px solid transparent}
.g-lista a:hover{background:var(--tint);color:var(--nav-forte)}
.g-lista a[aria-current=page]{background:var(--tint);color:var(--nav-forte);font-weight:600;border-left-color:var(--acento)}
.g-side-rodape{margin-top:8px;padding:14px 10px 4px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--muted)}
.g-side-rodape strong{color:var(--ink);font-size:14px}
.g-side-rodape a,.g-side-rodape button{background:none;border:0;padding:0;color:var(--primary-ink);text-decoration:underline;cursor:pointer;font-size:12.5px;min-height:28px}
.g-content{flex:1 1 0;min-width:0}
.g-content>main{padding:0!important;gap:24px!important}
.g-demo{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 16px;font-size:13px;margin-bottom:22px}
.g-real{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:10px 16px;font-size:13px;margin-bottom:22px}
.g-real button{background:none;border:0;padding:0;margin-left:6px;color:var(--primary-ink);text-decoration:underline;cursor:pointer;font:inherit}
.g-qr{display:flex;flex-direction:column;align-items:center;text-align:center;margin:14px 0}
.g-qr img{width:200px;height:200px;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line)}
.g-chave{display:inline-block;margin-top:4px;padding:4px 8px;border-radius:8px;background:var(--tint);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.06em;user-select:all;word-break:break-all}
/* ───── telas reais: Início, Sets e Claims, Liberar pagamento ───── */
.sc-main{display:flex;flex-direction:column;gap:24px;min-width:0}
.sc-cab{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px}
.sc-cab h1{margin:0}
.sc-sub{margin:6px 0 0;color:var(--muted)}
.sc-chips{display:flex;flex-wrap:wrap;gap:8px}
.sc-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sc-card h2{font-size:20px;letter-spacing:-0.01em}
.sc-sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.sc-crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--muted)}
.sc-crumb strong{color:var(--ink)}
.sc-etapas{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.sc-etapa{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.sc-etapa b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--track);color:var(--muted);font-size:12.5px}
.sc-etapa.feita b{background:var(--ok-bg);color:var(--ok-ink)}
.sc-etapa.atual{color:var(--ink);font-weight:700}
.sc-etapa.atual b{background:var(--primary);color:var(--on-primary)}
.sc-dados{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sc-dado{flex:1 1 180px;padding:14px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.sc-dado span{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.sc-dado strong{display:block;margin-top:2px;font-size:17px}
.sc-edita-set{display:flex;flex-direction:column;gap:14px}
.sc-prog{display:flex;flex-direction:column;gap:8px}
.sc-prog-txt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px;font-weight:600}
.sc-barra{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.sc-barra div{height:100%;background:var(--primary);border-radius:99px}
.sc-tabela{min-width:840px}
.sc-linha{display:grid;grid-template-columns:40px minmax(90px,.8fr) minmax(130px,1.2fr) minmax(150px,1.4fr) 96px minmax(170px,1.3fr);gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13.5px}
.sc-linha>[role=cell],.sc-linha>[role=columnheader]{min-width:0;overflow-wrap:anywhere}
.sc-cabeca{background:var(--band);font-weight:600;color:var(--muted);border-top:0}
.sc-num{color:var(--muted);font-variant-numeric:tabular-nums}
.sc-membro{font-weight:600}
.sc-sit{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.sc-linha input{height:38px;padding:0 12px;font-size:13.5px}
.sc-mini{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.sc-mini:hover{background:var(--tint)}
.sc-aviso{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 14px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px;line-height:1.5;border-top:1px solid var(--line)}
.sc-aviso-txt{flex:1 1 320px}
.sc-aviso-btn{display:flex;flex-wrap:wrap;gap:8px}
.sc-rodape{display:flex;flex-direction:column;gap:10px}
.sc-colar-res{display:flex;flex-direction:column;gap:10px}
.sc-lista-res{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6}
.sc-lista-res .bad{color:var(--bad-ink)}
.sc-lista-res .warn{color:var(--warn-ink)}
.sc-duas{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.sc-esq{flex:1 1 440px}
.sc-dir{flex:1 1 360px}
.sc-tabela2{min-width:480px}
.sc-linha2{display:grid;grid-template-columns:minmax(80px,.8fr) minmax(150px,1.6fr) minmax(120px,1fr) 90px;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px}
.sc-sel-linha{background:var(--tint)}
.sc-painel{display:flex;flex-direction:column;gap:14px}
.sc-painel-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.sc-painel-cab h2{margin:0;font-size:20px}
.sc-nota{padding:12px 14px;border-radius:12px;background:var(--band);font-size:13.5px;line-height:1.5}
.sc-nota.warn{background:var(--warn-bg);color:var(--warn-ink)}
.sc-nota-btn{margin-top:8px}
.sc-previa{font-size:13.5px;line-height:1.5}
.sc-previa:empty{display:none}
.sc-h3{margin:6px 0 0;font-size:18px}
.sc-outras{display:flex;flex-direction:column}
.sc-onde{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sc-onde legend{padding:0;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.sc-onde label{display:flex;align-items:center;gap:8px;min-height:36px}
.sc-mud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.sc-mud>div{flex:1 1 320px;min-width:0}
.lb-tabela{min-width:780px}
.lb-linha{display:grid;grid-template-columns:54px minmax(170px,2fr) minmax(90px,.8fr) minmax(100px,.9fr) minmax(130px,1.1fr) minmax(150px,1fr);gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px}
.lb-cab{background:var(--band);font-weight:600;color:var(--muted);border-top:0}
.lb-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.lb-ferr{display:inline-flex;flex-wrap:wrap;gap:4px}
.lb-av{color:var(--warn-ink)}
.ini-duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:24px;align-items:start}
.ini-lista{display:flex;flex-direction:column}
.ini-linha{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ini-ativ{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.ini-ativ span,.ini-linha>div,.sc-mud>div{min-width:0;overflow-wrap:anywhere}
@media (max-width:700px){.sc-card{padding:18px}}
/* celular: as tabelas largas viram cartões (uma vaga ou um set por cartão), sem rolar para o lado */
@media (max-width:760px){
  .sc-tabela,.sc-tabela2,.lb-tabela{min-width:0}
  .sc-tabela .sc-cabeca,.sc-tabela2 .sc-cabeca,.lb-cab{display:none}
  .sc-tabela .sc-linha{grid-template-columns:30px minmax(0,1fr) 96px;gap:8px 10px;padding:14px 6px}
  .sc-tabela .sc-linha>[role=cell]:nth-child(1){grid-column:1;align-self:center}
  .sc-tabela .sc-linha>[role=cell]:nth-child(2){grid-column:2/4;align-self:center;font-size:15px}
  .sc-tabela .sc-linha>[role=cell]:nth-child(3){grid-column:1/4}
  .sc-tabela .sc-linha>[role=cell]:nth-child(4){grid-column:1/3}
  .sc-tabela .sc-linha>[role=cell]:nth-child(5){grid-column:3}
  .sc-tabela .sc-linha>[role=cell]:nth-child(6){grid-column:1/4}
  .sc-tabela .sc-linha>[role=cell][data-rot]::before,.lb-linha>[role=cell][data-rot]::before{content:attr(data-rot);display:block;margin-bottom:3px;font-size:12px;font-weight:600;color:var(--muted)}
  .sc-linha input{height:44px;font-size:16px}
  .sc-linha2{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 6px}
  .sc-linha2>[role=cell]:nth-child(1){grid-column:1;grid-row:1;align-self:center;font-size:15px}
  .sc-linha2>[role=cell]:nth-child(4){grid-column:2;grid-row:1}
  .sc-linha2>[role=cell]:nth-child(2){grid-column:1/-1;grid-row:2}
  .sc-linha2>[role=cell]:nth-child(3){grid-column:1/-1;grid-row:3}
  .lb-linha{grid-template-columns:44px minmax(0,1fr);gap:8px 12px;padding:14px 6px}
  .lb-linha>[role=cell]:nth-child(1){grid-column:1;grid-row:1;align-self:start}
  .lb-linha>[role=cell]:nth-child(2){grid-column:2;grid-row:1}
  .lb-linha>[role=cell]:nth-child(n+3){grid-column:2}
  .lb-linha .mlp-check{width:26px;height:26px}
}

/* ───── leva 2: anotar por membro, no site, abrir mais sets, Cadastros Joiners, Pagamentos em atraso ───── */
.sc-modo{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sc-modo-rot{font-size:13px;font-weight:600;color:var(--muted);margin-right:4px}
.sc-modo-bt{min-height:36px;padding:0 18px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.sc-modo-bt:hover{background:var(--tint)}
.sc-modo-bt[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sc-mais{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:-4px}
.ms-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}
.sc-site{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 16px;border-radius:12px;background:var(--band);font-size:14px;line-height:1.5}
.sc-site>div:first-child{flex:1 1 320px;min-width:0}
.sc-site.no-site{background:var(--tint)}
.sc-site.cancelado{background:var(--bad-bg);color:var(--bad-ink)}
.sc-site.em-aberto{background:#E6F0FB}
.g-chip.aberto{background:#E2EEFB;color:#1D5A9E}
.sc-vazio{padding:18px 12px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.sc-lista-res .ok{color:var(--ok-ink)}
.pe-duas{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.pe-esq{flex:1 1 340px;min-width:0}
.pe-dir{flex:2 1 480px;min-width:0}
.pe-lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden auto;max-height:560px}
.pe-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:10px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.pe-item:first-child{border-top:0}
.pe-item:hover{background:var(--tint)}
.pe-item.sel{background:var(--tint);box-shadow:inset 3px 0 0 var(--primary)}
.pe-item-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;width:100%}
.pe-tags{display:inline-flex;flex-wrap:wrap;gap:6px}
.pe-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.pe-stats>div{padding:12px 14px;border:1px solid var(--line);border-radius:12px;min-width:0}
.pe-stats strong{display:block;font-size:18px}
.pe-stats span{display:block;font-size:12.5px;color:var(--muted)}
.pe-det-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.pe-det-cab h2{margin:0;overflow-wrap:anywhere}
.pe-vazio{padding:12px 0}
.pe-numero-linha{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pe-numero-txt{font-variant-numeric:tabular-nums;font-weight:600}
.pe-hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.pe-troca{display:flex;flex-direction:column;gap:14px}
.pe-hist{display:flex;flex-direction:column}
.pe-hist-linha{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pe-hist-linha>div{flex:1 1 260px;min-width:0;overflow-wrap:anywhere}
.at-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px}
.at-chip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;min-width:0}
.at-chip strong{display:block;font-size:22px;letter-spacing:-0.01em}
.at-chip span{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.at-tabela{min-width:800px}
.at-linha{display:grid;grid-template-columns:minmax(130px,1.2fr) minmax(56px,.4fr) 52px minmax(100px,.9fr) minmax(130px,1fr) minmax(240px,1.6fr);gap:8px 12px;align-items:center;padding:12px;border-top:1px solid var(--line);font-size:13.5px}
.at-linha>[role=cell],.at-linha>[role=columnheader]{min-width:0;overflow-wrap:anywhere}
.at-cab{background:var(--band);font-weight:600;color:var(--muted);border-top:0}
.at-linha.sel{background:var(--tint)}
.at-itens summary{cursor:pointer;font-weight:600;color:var(--primary-ink)}
.at-itens ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.5}
.at-num{display:flex;gap:8px;align-items:center}
.at-num input{height:38px;padding:0 10px;font-size:13.5px;min-width:0;flex:1 1 100px}
.at-num .sc-mini{white-space:nowrap;flex:0 0 auto}
.at-linha .g-chip{white-space:normal;line-height:1.3;text-align:left;max-width:100%}
.at-chamar{white-space:nowrap}
.at-regras{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--muted)}
@media (max-width:760px){
  .at-tabela{min-width:0}
  .at-cab{display:none}
  .at-linha{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;padding:14px 6px}
  .at-linha>[role=cell]:nth-child(1){grid-column:1/-1;font-size:15px}
  .at-linha>[role=cell]:nth-child(6){grid-column:1/-1}
  .at-linha>[role=cell][data-rot]::before{content:attr(data-rot);display:block;margin-bottom:3px;font-size:12px;font-weight:600;color:var(--muted)}
  .at-num input{height:44px;font-size:16px}
  .pe-lista{max-height:none}
  .sc-modo-bt{min-height:44px}
}

/* ───── leva 2B: Repasses ───── */
.rp-lista{display:flex;flex-direction:column;gap:18px}
.rp-card{gap:16px}
.rp-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.rp-topo h2{margin:0;font-size:18px}
.rp-par{display:flex;flex-wrap:wrap;gap:12px}
.rp-lado{flex:1 1 240px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.rp-rot{font-size:13px;color:var(--muted)}
.rp-quem{font-weight:700;overflow-wrap:anywhere}
.rp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.rp-itens{display:flex;flex-direction:column}
.rp-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rp-item>span:first-child{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.rp-chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.rp-chips .g-chip{white-space:normal}
.rp-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.rn-secao{display:flex;flex-direction:column;gap:12px}
.rn-itens{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden auto;max-height:260px}
.rn-item{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.rn-item:first-child{border-top:0}
.rn-item:hover{background:var(--tint)}
.rn-item.off{opacity:.65;cursor:not-allowed}
.rn-item input{width:22px;height:22px;flex:0 0 auto}
.rn-item-txt{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.rn-esc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rn-esc-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px}
.rn-x{border:0;background:none;color:var(--muted);font:inherit;font-size:18px;line-height:1;padding:0 4px;cursor:pointer}
.rn-x:hover{color:var(--ink)}
.rn-sug{display:flex;flex-wrap:wrap;gap:8px}
.rn-secao .pe-lista{max-height:240px}
@media (max-width:760px){
  .rn-item{padding:12px 12px}
  .rp-acoes .g-btn{flex:1 1 100%}
}

/* ───── leva 2B: Envios nacionais ───── */
.ev-livres{display:flex;flex-direction:column}
.ev-livre{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ev-livre>div{flex:1 1 260px;min-width:0;overflow-wrap:anywhere}
.ev-end{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;min-width:0}
.ev-end-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.ev-end-txt{font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.ev-info{margin:0;font-size:14px;line-height:1.5}
.ev-frete{max-width:260px}
.ev-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px 14px}
.ev-form .ev-larga{grid-column:1/-1}
.g-sem-perm{max-width:620px;margin:60px auto;text-align:center}
@media (max-width:900px){
  .g-shell{flex-direction:column;align-items:stretch;gap:16px}
  .g-side{position:static;flex-basis:auto;width:100%;max-height:none}
  .g-menu-btn{display:inline-flex;align-items:center}
  .g-lista,.g-side-rodape{display:none}
  .g-side.aberto .g-lista{display:flex}
  .g-side.aberto .g-side-rodape{display:block}
}

/* ───── janelas e avisos ───── */
.fundo-modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(43,43,51,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.modal{width:100%;max-width:580px;background:var(--surface);color:var(--ink);border-radius:18px;padding:26px;margin:auto 0;box-shadow:0 20px 60px var(--shadow);display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:13.5px;max-width:min(560px,calc(100vw - 32px));z-index:60;box-shadow:0 8px 30px var(--shadow)}

/* ───── janelas de nova CEG e nova POB ───── */
.modal h2{margin:0;font-size:20px;color:var(--ink)}
.modal p.g-erro{margin:0;color:var(--coral-dark);font-size:13px;font-weight:600}
.g-acoes{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.g-rotulo{font-size:12.5px;font-weight:600;color:var(--muted)}
.g-check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink)}
.g-check input{width:20px;height:20px}

/* ───── abas da página Sets e claims e etiquetas de estado ───── */
.g-abas{display:flex;flex-wrap:wrap;gap:8px}
.g-aba{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s}
.g-aba:hover{background:var(--tint)}
.g-aba[aria-selected=true]{background:var(--tint);border-color:var(--acento);color:var(--nav-forte)}
.g-chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.g-chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.g-chip.bad{background:var(--bad-bg);color:var(--bad-ink)}

/* ───── modo noturno (o botão fica no fim de cada tela do painel) ───── */
html[data-tema="escuro"]{
  --bg:#12141C; --band:#262A3C; --surface:#1D2030; --ink:#ECEDF3; --muted:#A7ACC0; --line:rgba(255,255,255,0.10); --field-line:rgba(255,255,255,0.30);
  --primary:#9A9DDA; --primary-ink:#BFC1F2; --on-primary:#12141C; --link:#BFC1F2;
  --tint:#2A2F47; --tint-ink:#C9CBF5; --track:#353A55;
  --ok-bg:#16382A; --ok-ink:#7FD6A8; --ok-ink2:#7FD6A8;
  --warn-bg:#3B3116; --warn-ink:#F2C879; --gray-bg:#2A2E43; --gray-ink:#B8BCD0;
  --bad-bg:#47202A; --bad-ink:#FF9AA2; --disabled-bg:#3A3F57;
  --purple:#A9ABDF; --purple-dark:#9A9DDA; --purple-tint:#2A2F47;
  --shadow:rgba(0,0,0,0.65);
  --foco:#9EA1F0; --nav-bg:#1A1C28; --nav-linha:rgba(255,255,255,0.10); --nav-txt:#B5B9CE; --nav-forte:#FFFFFF; --acento:#9EA1F0; --titulo:#C9CBF5; --menu-txt:#B5B9CE;
  color-scheme:dark;
}
::placeholder{color:var(--muted);opacity:.75}
.g-fim{display:flex;align-items:center;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.g-switch{position:relative;flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:1px solid var(--field-line);background:var(--track);cursor:pointer;padding:0;transition:background .2s}
.g-switch-bola{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.g-switch[aria-checked=true]{background:var(--acento);border-color:var(--acento)}
.g-switch[aria-checked=true] .g-switch-bola{transform:translateX(20px)}

#app button[disabled]{opacity:.5;cursor:not-allowed}

/* ───── histórico da vaga (Masterlist) ───── */
.g-hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.g-hist li{display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:3px solid var(--acento);font-size:14px;color:var(--ink)}
.g-hist li span{font-size:13px;color:var(--muted)}


/* ───── Masterlist: POBs em sanfona, uma tabela por POB ───── */
.ml-resumo{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button.ml-fch{border:0;font-family:inherit;line-height:1.5;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
button.ml-fch:hover{box-shadow:inset 0 0 0 1px var(--muted)}
button.ml-fch[aria-pressed=true]{box-shadow:0 0 0 2px var(--acento)}
.ml-dica{font-size:13px}
.ml-lista{display:flex;flex-direction:column;gap:24px}
.ml-grupo{display:flex;flex-direction:column;gap:8px}
.ml-ceg{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;font-size:15px;font-weight:700;color:var(--muted)}
.ml-ceg .ml-meta{font-weight:400}
.ml-ferr{margin-left:auto;display:inline-flex;gap:4px}
.ml-lnk{background:none;border:0;padding:4px 8px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--primary-ink);cursor:pointer;text-decoration:underline}
.ml-lnk:hover{background:var(--tint)}
.ml-acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ml-pob{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;width:100%;padding:14px 20px;background:transparent;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ml-pob:hover{background:var(--tint)}
.ml-pob svg{flex:0 0 auto;color:var(--muted);transition:transform .15s ease}
.ml-pob[aria-expanded=true] svg{transform:rotate(90deg)}
.ml-nome{display:flex;flex-direction:column;gap:2px;min-width:200px}
.ml-nome strong{font-size:17px}
.ml-meta{font-size:13.5px;color:var(--muted)}
.ml-chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.ml-corpo{border-top:1px solid var(--line)}
.ml-rolagem{overflow-x:auto}
.ml-tabela{min-width:840px}
.ml-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px}
.ml-filtros{padding:18px 20px;gap:14px}
.ml-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.ml-campo{display:flex;flex-direction:column;gap:6px}
.ml-campo label{font-size:13px;font-weight:600;color:var(--muted)}
.ml-campo input,.ml-campo select{box-sizing:border-box;width:100%;min-height:44px;padding:0 12px;border:1px solid var(--field-line);border-radius:8px;font:inherit;background:var(--surface);color:var(--ink)}
.ml-btns{display:flex;flex-wrap:wrap;gap:12px}
.ml-barra{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--acento);border-radius:14px;background:var(--tint)}
.ml-barra-fixa{position:sticky;bottom:14px;z-index:6;box-shadow:0 8px 26px var(--shadow)}
.mlp-linha{display:grid;grid-template-columns:32px 52px minmax(80px,.9fr) minmax(170px,2.2fr) 78px 84px 50px minmax(170px,1.9fr);gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:13px}
.mlp-linha>[role=cell]{overflow-wrap:anywhere}
.mlp-cab{background:var(--band);font-size:13px;font-weight:600;color:var(--muted);border-top:0}
.mlp-set{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 16px;background:var(--tint);border-top:1px solid var(--line);font-size:14px}
.mlp-set strong{font-size:15px}
[data-mlp-row]{cursor:pointer}
[data-mlp-row]:hover{background:var(--tint)}
[data-mlp-row]:focus-visible{outline-offset:-2px}
.mlp-check{width:20px;height:20px;accent-color:var(--primary)}
#app select.mlp-sel{box-sizing:border-box;width:100%;height:30px;min-height:0;padding:0 6px 0 10px;border:1px solid var(--field-line);border-radius:8px!important;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;line-height:1.2}
.mlp-linha strong{line-height:1.35}
.mlp-linha .ml-meta{font-size:12.5px;line-height:1.3}
.ml-joiner{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.ml-stat{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}

/* ───── Sets e Claims: aba Criar sets mais leve (resumo de uma linha + "Mudar") e aba Editar com ações recolhidas ───── */
.cs-painel{display:flex;flex-direction:column;gap:20px}
.cs-painel[hidden],.cs-det-corpo[hidden],.cs-novo-membro[hidden],.cs-erro[hidden]{display:none!important}
.cs-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px}
.cs-cab h2{margin:0;font-size:20px;letter-spacing:-0.01em}
.cs-cab p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.cs-linha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 170px;gap:16px;align-items:end}
.cs-campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.cs-campo label{font-size:13px;font-weight:600;color:var(--muted)}
.cs-novos{display:flex;flex-wrap:wrap;gap:0 20px;margin-top:-8px}
.cs-link{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 4px;background:none;border:0;border-radius:8px;font:inherit;font-size:13.5px;font-weight:600;color:var(--primary-ink);cursor:pointer}
.cs-link:hover{background:var(--tint)}
.cs-dets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cs-det{border-bottom:1px solid var(--line)}
.cs-det-resumo{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:10px 0}
.cs-det-rot{font-size:13px;font-weight:600;color:var(--muted)}
.cs-det-txt{font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.cs-mudar{min-height:40px;min-width:76px;padding:0 16px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.cs-mudar:hover{background:var(--tint)}
.cs-det-corpo{display:flex;flex-direction:column;gap:14px;padding:2px 0 18px}
.cs-chips{display:flex;flex-wrap:wrap;gap:8px}
.cs-chip{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 4px 0 16px;border-radius:999px;background:var(--tint);color:var(--primary-ink);font-weight:600;font-size:14px}
.cs-chip button{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--primary-ink);padding:0;cursor:pointer}
.cs-chip button:hover{background:rgba(75,80,120,.14)}
.cs-add{min-height:40px;padding:0 16px;border-radius:999px;border:1px dashed var(--primary);background:var(--surface);color:var(--primary-ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.cs-add:hover{background:var(--tint)}
.cs-novo-membro{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:520px}
.cs-novo-membro .cs-campo{flex:1 1 220px}
.cs-erro{margin:0;flex:1 0 100%;color:var(--coral-dark);font-size:13px;font-weight:600}
.cs-nota{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.cs-valores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.cs-check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.cs-check input{width:22px;height:22px;flex:0 0 auto}
.cs-resumo{padding:14px 16px;border-radius:12px;background:var(--band);font-size:15px;line-height:1.6}
.cs-acoes{display:flex;flex-wrap:wrap;gap:12px}
.cs-info{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 20px}
.cs-info summary{display:flex;align-items:center;min-height:50px;cursor:pointer;font-size:14px;font-weight:600;color:var(--primary-ink)}
.cs-info p{margin:0 0 16px;font-size:14px;line-height:1.6;color:var(--muted)}
.cs-acao{border-top:1px solid var(--line)}
.cs-acao summary{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-height:50px;cursor:pointer;font-size:15px;font-weight:600}
.cs-acao-corpo{display:flex;flex-direction:column;gap:12px;padding:2px 0 16px}
.cs-info summary,.cs-acao summary{list-style:none}
.cs-info summary::-webkit-details-marker,.cs-acao summary::-webkit-details-marker{display:none}
.cs-info summary::after,.cs-acao summary::after{content:'';flex:0 0 auto;margin:-4px 4px 0 auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s ease}
.cs-info[open] summary::after,.cs-acao[open] summary::after{margin-top:4px;transform:rotate(-135deg)}
.cs-info summary:hover,.cs-acao summary:hover{color:var(--ink)}
@media (max-width:700px){
  .cs-card{padding:18px}
  .cs-linha{grid-template-columns:minmax(0,1fr)}
  .cs-det-resumo{grid-template-columns:minmax(0,1fr) auto}
  .cs-det-txt{grid-column:1 / -1;order:3}
  .cs-acoes .g-btn{flex:1 1 100%}
}

/* ───── Importar CEGs ───── */
.imp-h2{margin:0;font-size:20px;letter-spacing:-0.01em}
.imp-h3{margin:0;font-size:18px}
.imp-h4{margin:6px 0 0;font-size:15px}
.imp-p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.imp-previa{display:flex;flex-direction:column;gap:14px;padding-top:20px;border-top:1px solid var(--line)}
.imp-mapa,.imp-amostra{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.imp-lin{display:grid;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:13.5px}
.imp-cab{background:var(--band);border-top:0;font-size:13px;font-weight:600;color:var(--muted)}
.imp-mapa .imp-lin{grid-template-columns:minmax(150px,2fr) minmax(90px,.8fr) minmax(210px,2fr)}
.imp-amostra{min-width:780px}
.imp-amostra .imp-lin{grid-template-columns:52px minmax(170px,2fr) minmax(90px,1fr) minmax(120px,1.4fr) 84px minmax(150px,1.6fr)}
#app select.imp-sel{box-sizing:border-box;width:100%;height:34px;min-height:0;padding:0 12px;font-size:13.5px;border:1px solid var(--field-line);background:var(--surface);color:var(--ink);font-family:inherit}
.imp-avisos{display:flex;flex-direction:column;gap:8px}
.imp-aviso{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--surface)}
.imp-aviso summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:14px}
.imp-aviso ul{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}

/* ───── Envios nacionais ───── */
.env-topo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.env-linha{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.env-lista{display:flex;flex-direction:column;gap:16px}
.env-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.env-cab{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px}
.env-nome{font-size:17px}
.env-corpo{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.env-itens{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.env-item{display:flex;align-items:center;gap:12px}
.env-foto{flex:0 0 auto;width:44px;height:44px;border-radius:8px;background:var(--band);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.env-item-txt{display:flex;flex-direction:column;font-size:14px}
.env-end{font-size:14px;line-height:1.5}
.env-end strong{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.env-aviso{margin:0;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn-ink);font-size:13.5px}
.env-acao{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.env-valor{max-width:260px}
.env-vazio{margin:0;padding:24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.lib-off{background:var(--disabled-bg) !important;color:var(--muted) !important;cursor:not-allowed}

  /* ------------------------------------------------ Importar CEG: leitor da planilha (roda no navegador; nada é enviado nem gravado) */

  function csvParaLinhas(txt) {
    txt = String(txt || '').replace(/^﻿/, '');
    const amostra = txt.slice(0, 6000).split(/\r?\n/).slice(0, 14).join('\n');
    const conta = (ch) => amostra.split(ch).length - 1;
    const sep = conta(';') > conta(',') && conta(';') >= conta('\t') ? ';' : (conta('\t') > conta(',') ? '\t' : ',');
    const linhas = []; let linha = []; let cel = ''; let aspas = false;
    for (let i = 0; i < txt.length; i++) {
      const c = txt[i];
      if (aspas) { if (c === '"') { if (txt[i + 1] === '"') { cel += '"'; i++; } else aspas = false; } else cel += c; }
      else if (c === '"' && cel === '') aspas = true;
      else if (c === sep) { linha.push(cel); cel = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; linha.push(cel); linhas.push(linha); linha = []; cel = ''; }
      else cel += c;
    }
    if (cel !== '' || linha.length) { linha.push(cel); linhas.push(linha); }
    return linhas;
  }
  const parseValorPlanilha = (s) => { const t = String(s || '').replace(/[^\d,.]/g, ''); if (!/\d/.test(t)) return 0; const n = t.indexOf(',') >= 0 ? parseFloat(t.replace(/\./g, '').replace(',', '.')) : parseFloat(t); return isFinite(n) ? n : 0; };

  /* lê a aba de uma CEG no formato da planilha de hoje: "set. N", linha "Membro", e as vagas (Membro, Joiner + @, Telefone, Valor, Prazo, Pagamento, Status, POB na coluna J) */
  function lerPlanilhaCeg(linhas) {
    const cel = (r, i) => (r[i] == null ? '' : String(r[i]).replace(/[ \t]+/g, ' ').replace(/\s+/g, ' ').trim());
    const res = { ceg: '', linhas: linhas.length, vagas: [], secoes: [], pobs: [], avisos: [], pessoas: 0, tamPadrao: 0 };
    const aviso = (tipo, linha, texto) => res.avisos.push({ tipo, linha, texto });

    res.ceg = topo[0] || '';
    let pob = ''; let secao = -1; let setN = 0; let modo = 'set'; let ultimoSet = 0;
    const novaSecao = (linha) => { secao++; res.secoes.push({ pob: '', linha }); };
    const nomeiaSecao = () => { if (secao >= 0 && !res.secoes[secao].pob) res.secoes[secao].pob = pob; };

      const b = cel(r, 1); const c = cel(r, 2); const d = cel(r, 3); const e = cel(r, 4); const f = cel(r, 5); const g = cel(r, 6); const h = cel(r, 7); const j = cel(r, 9);
      const soTitulo = !(c || d || e || f || g || h);
      const m = RE_SET_PLANILHA.exec(b);
      if (m && soTitulo) {
        const n = parseInt(m[1], 10);
        if (secao < 0 || (n === 1 && ultimoSet !== 1)) novaSecao(i + 1);
        setN = n; modo = 'set'; ultimoSet = n; return;
      }
      if (soTitulo && /^(pedidos )?avulsos?$/i.test(b)) { modo = 'avulso'; setN = 0; if (secao < 0) novaSecao(i + 1); return; }
      if (b.toLowerCase() === 'membro') { if (j && !RE_FOTO_ITENS.test(j)) { pob = j; nomeiaSecao(); } return; }
      if (!b) { aviso('sem-membro', i + 1, 'Linha com dados, mas sem o nome do membro: ficou de fora.'); return; }
      if (j && !RE_FOTO_ITENS.test(j)) { pob = j; nomeiaSecao(); }
      if (secao < 0) { aviso('fora-de-set', i + 1, 'Linha antes do primeiro set: ficou de fora.'); return; }
      nomeiaSecao();
      res.vagas.push({ linha: i + 1, secao, pob, set: modo === 'avulso' ? 0 : setN, modo, membroNome: b, celula: c, final: d, valor: e, prazo: f, pago: g, status: h });
    });
    /* o mesmo nome de POB em duas partes da planilha vira "NOME (2)", para não misturar os sets */
    const partes = {};
    res.vagas.forEach((v) => { const k = v.pob || 'Sem POB'; partes[k] = partes[k] || []; if (!partes[k].includes(v.secao)) partes[k].push(v.secao); });
    Object.keys(partes).forEach((k) => { if (partes[k].length > 1) aviso('pob-repetido', 0, k + ' aparece em ' + partes[k].length + ' partes da planilha. Entrou como "' + k + '" e "' + k + ' (2)"' + (partes[k].length > 2 ? ' etc.' : '') + '.'); });
    res.vagas.forEach((v) => {
      const k = v.pob || 'Sem POB'; const idx = partes[k].indexOf(v.secao); v.pobNome = idx === 0 ? k : k + ' (' + (idx + 1) + ')';
      const hs = v.celula.match(/@[^\s,;]+/g) || [];
      v.handle = hs.length ? hs[0].replace(/[.)\]]+$/, '') : '';
      v.nome = v.celula.replace(/@[^\s,;]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (hs.length > 1) aviso('varios-arrobas', v.linha, 'Mais de um @ na mesma vaga: ficou o primeiro.');
      if (!v.handle && v.nome) aviso('sem-arroba', v.linha, 'Tem nome, mas não tem @: a vaga entrou sem @.');

    const mapa = new Map();
    res.vagas.forEach((v) => {
      let p = mapa.get(v.pobNome); if (!p) { p = { nome: v.pobNome, secao: v.secao, sets: new Map() }; mapa.set(v.pobNome, p); }
      const ks = v.modo === 'avulso' ? 'A' : String(v.set);
      let s = p.sets.get(ks); if (!s) { s = { set: v.modo === 'avulso' ? 0 : v.set, avulso: v.modo === 'avulso', vagas: [] }; p.sets.set(ks, s); }
      s.vagas.push(v); v.membro = s.vagas.length; v.avulso = s.avulso; v.setNum = s.set;

    res.tamPadrao = Number(Object.keys(tams).sort((x, y) => tams[y] - tams[x])[0]) || 0;

    res.vagas.forEach((v) => {
      if (v.pagoBool === true && !v.handle && !v.nome) aviso('paga-sem-dono', v.linha, 'Vaga marcada como paga, mas sem nome nem @.');
      if (v.pagoBool !== true && !v.handle && !v.nome && v.status) aviso('livre-com-item', v.linha, 'Vaga sem dono, mas com status de item ("' + v.status + '").');
      if (v.pagoBool === null) aviso('pagamento-vazio', v.linha, 'A coluna Pagamento está vazia: ficou como não paga.');
      if (!v.valorNum) aviso('valor-invalido', v.linha, 'Valor vazio ou ilegível ("' + v.valor + '").');
      if (!v.prazoOk) aviso('prazo-vazio', v.linha, 'Prazo vazio ou ilegível.');

  /* ---- Masterlist: trocar o status passa pela função do banco; só mexe em vaga já paga ---- */
  async function mudarStatusReal(mlIds, novo) {
    const ids = mlIds.map((x) => parseInt(String(x).replace(/^b/, ''), 10)).filter((n) => isFinite(n));
    if (!ids.length) return { alteradas: 0, ignoradas: 0 };
    const r = await rpc('gom_mudar_status', { p_ids: ids, p_novo: novo });
    if (!r.ok) { toast(r.msg); return null; }
    try { await atualizar({ vagas: ids }); } catch (e) { toast('O status foi gravado, mas não consegui atualizar a tela. Use "Atualizar agora".'); }
    return r.dados;
  }

    if (seletor) seletor.disabled = true;

      const v = mlIds.length === 1 ? ML.find((x) => x.id === mlIds[0]) : null;

        ? (r.alteradas ? 'Status da vaga ' + (v ? idClaim(v) + (v.handle ? ' (' + v.handle + ')' : '') : '') + ': ' + novo + '. Gravado.' : 'Nada mudou: a vaga já estava com esse status ou ainda não está paga.')

  /* ================================================ Sets e Claims (real): criar sets, anotar claims, editar claim, últimas mudanças.
     Tudo o que muda passa por uma função do banco (gom_*). A tela só mostra o que o banco devolveu depois de cada gravação. */
  const PADRAO_MEMBROS = ['Membro 1', 'Membro 2', 'Membro 3', 'Membro 4', 'Membro 5', 'Membro 6'];
  const ABAS_SC = [['criar', 'Criar sets', 'criar_sets'], ['anotar', 'Anotar claims', 'anotar_claims'], ['editar', 'Editar claim', 'anotar_claims']];

  /* as gravações andam uma de cada vez, na ordem em que foram pedidas (assim "sair da linha" e "enviar para revisão" nunca se atropelam) */
  const enfileirar = (fn) => { const p = SC.fila.then(fn); SC.fila = p.catch(() => {}); return p; };
  const porNomeSC = (a, b) => semAcento(a.nome).localeCompare(semAcento(b.nome));
  const listaCegsSC = () => DB.cegs.slice().sort(porNomeSC);

  const nomePobSC = (id) => (IX.pob.get(id) || {}).nome || '?';

  const opcaoSC = (v, t, sel) => '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(t) + '</option>';
  const rotuloSetSelect = (s) => { const vs = vagasDoSetSC(s.id); return 'Set ' + s.numero + ' · ' + ROT_SET[s.estado] + (noSiteSC(s) ? ' · no site' : '') + (s.estado === 'cancelado' ? '' : ' · ' + preenchidasSC(vs) + ' de ' + vs.length + ' vagas'); };
  /* o set que serve de modelo para os novos: o último que não foi cancelado (ou o último de todos, se todos foram cancelados) */
  function setReferenciaSC(pobId) { const ss = pobId ? setsDaPobSC(pobId) : []; const ativos = ss.filter((x) => x.estado !== 'cancelado'); const l = ativos.length ? ativos : ss; return l[l.length - 1] || null; }
  const SVG_MAIS_SC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';
  const ultimoNumeroSC = (pobId) => setsDaPobSC(pobId).reduce((m, s) => Math.max(m, s.numero), 0);
  const setAtualSC = () => (SC.set ? IX.set.get(SC.set) : null);
  const vagaAtualSC = () => (SC.vaga ? IX.vaga.get(SC.vaga) : null);

  /* a escolha de CEG, POB e set vale para as abas Anotar claims e Editar claim; se algo sumiu do banco, a escolha volta ao começo */
  function garantirSelecaoSC() {
    if (SC.ceg && !IX.ceg.has(SC.ceg)) { SC.ceg = 0; SC.pob = 0; SC.set = 0; }
    if (SC.pob && (!IX.pob.has(SC.pob) || IX.pob.get(SC.pob).ceg_id !== SC.ceg)) { SC.pob = 0; SC.set = 0; }
    if (SC.set && (!IX.set.has(SC.set) || IX.set.get(SC.set).pob_id !== SC.pob)) SC.set = 0;
    if (SC.vaga && (!IX.vaga.has(SC.vaga) || IX.vaga.get(SC.vaga).set_id !== SC.set)) SC.vaga = 0;
    if (!SC.ceg && DB.cegs.length === 1) SC.ceg = DB.cegs[0].id;
    if (SC.ceg && !SC.pob) { const ps = listaPobsSC(SC.ceg); if (ps.length === 1) SC.pob = ps[0].id; }
    if (SC.pob && !SC.set) SC.set = setInicialSC(SC.pob);
    if (SC.pob) { const ms = membrosDaPobSC(SC.pob); if (!ms.some((m) => semAcento(m) === semAcento(SC.membro))) SC.membro = ms[0] || ''; } else SC.membro = '';
    const c = SC.criar;
    if (c.ceg && !IX.ceg.has(c.ceg)) { c.ceg = 0; c.pob = 0; c.membros = null; }
    if (c.pob && (!IX.pob.has(c.pob) || IX.pob.get(c.pob).ceg_id !== c.ceg)) { c.pob = 0; c.membros = null; }
    if (!c.ceg && DB.cegs.length === 1) c.ceg = DB.cegs[0].id;
  }
  function setInicialSC(pobId) {
    const todos = setsDaPobSC(pobId); if (!todos.length) return 0;
    const ativos = todos.filter((s) => s.estado !== 'cancelado'); const ss = ativos.length ? ativos : todos;
    return (ss.find((s) => s.estado === 'rascunho' || s.estado === 'aberto') || ss.find((s) => s.estado === 'revisao') || ss[ss.length - 1]).id;
  }
  /* os membros da POB (na ordem da lista da POB, mais qualquer nome que só exista em algum set) */
  function membrosDaPobSC(pobId) {
    const ordem = []; const visto = new Set();
    const add = (n) => { const k = semAcento(String(n || '')); if (k && !visto.has(k)) { visto.add(k); ordem.push(String(n)); } };
    const pob = IX.pob.get(pobId); ((pob && pob.membros) || []).forEach(add);
    setsDaPobSC(pobId).filter((s) => s.estado !== 'cancelado').forEach((st) => vagasDoSetSC(st.id).forEach((v) => add(v.membro)));
    return ordem;
  }
  /* a vaga de um membro em cada set da POB (sets cancelados ficam de fora) */
  function vagasDoMembroSC() {
    if (!SC.pob || !SC.membro) return [];
    const k = semAcento(SC.membro); const out = [];
    setsDaPobSC(SC.pob).forEach((st) => { if (st.estado === 'cancelado') return; const v = vagasDoSetSC(st.id).find((x) => semAcento(x.membro || '') === k); if (v) out.push({ v, s: st }); });
    return out;

  /* ---- aba ANOTAR CLAIMS ---- */

  const mesmoHandleSC = (v) => (v.joiner_handle ? (IX.porHandle.get(v.ceg_id + '|' + v.joiner_handle) || []) : []);
  const outrasVagasNoSetSC = (v) => mesmoHandleSC(v).filter((o) => o.id !== v.id && o.set_id === v.set_id);

  /* uma linha colada: "Membro [tab] Nome @arroba [tab] final". Também vale o formato antigo: número da vaga, @, nome, final. Devolve { v, handle, nome, final } ou { v?, erro } */
  const normMembroSC = (x) => semAcento(String(x || '').replace(/\s+/g, ' ').trim());

  async function entrarSenha(email, senha) {

  /* O banco devolve o QR como imagem SVG dentro de um endereço "data:". Se o SVG vier "cru" (com # nas cores e < >), o navegador corta o endereço no #
     e a imagem não aparece. Aqui o SVG cru é codificado; se já vier codificado ou em base64, passa como está. */

    return /^\s*</.test(corpo) ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(corpo) : s;
  }
  async function iniciarCadastroCodigo() {

      for (const f of sobras) { await SB.auth.mfa.unenroll({ factorId: f.id }); }   /* tentativas antigas que ficaram sem confirmar */
      const r = await SB.auth.mfa.enroll({ factorType: 'totp', issuer: 'DAZED CEGs', friendlyName: 'Autenticador ' + new Date().toLocaleString('sv-SE').slice(0, 16) });   /* issuer = o nome que aparece no aplicativo do celular */
      if (r.error || !r.data) { erroLogin(traduzErro(r.error)); return; }

  /* ---- salvar @, nome e número (cada parte é uma função do banco; para no primeiro erro e diz o que já foi salvo) ---- */
  function salvarPessoaPE(corrigirFinais) {
    const x = entradaSelPE(); if (!x || !x.ficha) return; const p = x.ficha;
    const f = lerFormPE(); const h = normHandleSC(f.handle); const n = String(f.nome || '').replace(/\s+/g, ' ').trim(); const num = String(f.numero || '').trim(); const tem = p.tem_numero === true;
    PE.form = { handle: f.handle, nome: f.nome, numero: f.numero, antigo: f.antigo, conferi: f.conferi };
    if (!h) return toast('Digite o @ da pessoa.');

        if (!falha && mudaN) { const r = await rpc('gom_editar_pessoa', { p_id: p.id, p_nome: n }); if (r.ok) { feitos.push('o nome'); ((r.dados && r.dados.vagas) || []).forEach((i) => vagas.push(i)); } else falha = { passo: 'o nome', r }; }
        if (!falha && num) {
          const args = { p_id: p.id, p_numero: num }; if (tem) args.p_final_antigo = String(f.antigo).trim(); if (corrigirFinais === true) args.p_corrigir_finais = true;
          const r = await rpc('gom_salvar_numero', args);
          if (r.ok) { feitos.push(r.dados && r.dados.mudou === false ? 'o número (já era esse)' : 'o número'); ((r.dados && r.dados.vagas_corrigidas) || []).forEach((i) => vagas.push(i)); PE.corrigir = null; }

      const novo = entradaSelPE(); if ($('#pe-main')) { desenharListaPE(); desenharDetalhePE(); if (novo && novo.ficha) carregarHistoricoPE(novo.id); }
      const lista = (a) => (a.length > 1 ? a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1] : a[0]);
      if (falha) toast((feitos.length ? 'Salvei ' + lista(feitos) + ', mas não salvei ' + falha.passo + ': ' : '') + msgPE(falha.r));

  /* abre o WhatsApp: a janela é aberta já no clique (senão o navegador bloqueia) e só depois recebe o endereço com o número que o banco devolveu */

    if (!r.ok) { try { if (wa) wa.close(); } catch (e) { /* ignora */ } toast(r.msg); return false; }

  /* ================================================ Pagamentos em atraso (real, leva 2): uma linha por pessoa, com os itens liberados que já passaram do prazo e ainda não foram pagos.
     Chamar no WhatsApp abre a conversa com a mensagem pronta (a administradora revisa e aperta enviar) e marca a pessoa como chamada, para duas ADMs não chamarem a mesma.
     O número completo vem de uma função do banco, só para quem tem a permissão. Esta tela nunca marca ninguém como pago e nunca mexe na Área do Joiner. */
  const AT = { ceg: 0, contato: 'todos', sel: '', msgs: {}, limite: 100 };
  const CONTATOS_AT = [['todos', 'Todas'], ['nunca', 'Nunca contatadas'], ['contatadas', 'Contatadas'], ['sem_numero', 'Sem número']];
  const WA_ICONE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.4A8 8 0 1121 12z"></path></svg>';

  /* dias de atraso: o dia seguinte ao prazo já conta como 1 (o prazo vale até o fim do dia) */
  function diasAtrasoVaga(v, agora) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v.prazo || ''); if (!m) return 0;
    return Math.max(0, diasEntre(new Date(+m[1], +m[2] - 1, +m[3]), agora));
  }
  /* uma linha por pessoa (pelo @; quem tem dono sem @ entra pelo nome, sem como chamar). Total = valor dos itens + multa:
     multa por dia do set x dias de atraso; se o set multiplica pelo número de itens, vale para cada item da pessoa naquele set. */
  function gruposAT() {
    const agora = new Date(); const mapa = new Map();
    DB.vagas.forEach((v) => {
      if (sitVaga(v, agora) !== 'Em atraso') return;
      if (AT.ceg && v.ceg_id !== AT.ceg) return;
      const chave = v.joiner_handle ? 'h:' + v.joiner_handle : 'n:' + semAcento(v.joiner_nome || '?');
      let g = mapa.get(chave);
      if (!g) { g = { chave, handle: v.joiner_handle || '', nome: v.joiner_nome || '', vagas: [], pessoa: v.joiner_handle ? (IX.pessoaPorHandle.get(v.joiner_handle) || null) : null, cegs: new Set() }; mapa.set(chave, g); }
      g.vagas.push(v); g.cegs.add(v.ceg_id); if (!g.nome && v.joiner_nome) g.nome = v.joiner_nome;
    });
    const gs = Array.from(mapa.values());
    gs.forEach((g) => {
      let valor = 0; let dias = 0; const porSet = new Map();
      g.vagas.forEach((v) => {
        valor += v.valor === null || v.valor === undefined ? 0 : Number(v.valor);
        dias = Math.max(dias, diasAtrasoVaga(v, agora));
        empurra(porSet, v.set_id ? 's' + v.set_id : 'v' + v.id, v);
      });
      let multa = 0;
      porSet.forEach((vs) => {
        const s = vs[0].set_id ? IX.set.get(vs[0].set_id) : null; const md = s ? Number(s.multa_dia || 0) : 0; if (!md) return;
        const d = Math.max.apply(null, vs.map((v) => diasAtrasoVaga(v, agora)));
        multa += md * d * (s.multa_por_item ? vs.length : 1);
      });
      g.valor = valor; g.multa = Math.round(multa * 100) / 100; g.total = Math.round((valor + g.multa) * 100) / 100; g.dias = dias; g.itens = g.vagas.length;
      g.vagas.sort((a, b) => diasAtrasoVaga(b, agora) - diasAtrasoVaga(a, agora) || a.id - b.id);
    });
    gs.sort((a, b) => (b.dias - a.dias) || (b.total - a.total) || (a.chave < b.chave ? -1 : 1));
    return gs;
  }
  const temNumeroAT = (g) => !!(g.pessoa && g.pessoa.tem_numero === true);
  const contatoDe = (g) => (g.pessoa && g.pessoa.contato_em ? g.pessoa : null);
  function filtradosAT(gs) {
    return gs.filter((g) => AT.contato === 'todos' || (AT.contato === 'nunca' && !contatoDe(g)) || (AT.contato === 'contatadas' && !!contatoDe(g)) || (AT.contato === 'sem_numero' && !temNumeroAT(g)));
  }
  function textoContatoAT(g) {
    if (!g.handle) return 'Sem @';
    const p = contatoDe(g); if (!p) return 'Nunca contatada';
    const d = diasEntre(new Date(p.contato_em), new Date());
    return (d <= 0 ? 'Contatada hoje' : (d === 1 ? 'Contatada ontem' : 'Contatada há ' + d + ' dias')) + (p.contato_por ? ' por ' + p.contato_por : '');
  }
  function descItemAT(v) {
    const s = v.set_id ? IX.set.get(v.set_id) : null;
    return nomeDoMembro(v) + ' (' + nomePobSC(v.pob_id) + (v.avulso || !s ? ', avulsa' : ', Set ' + s.numero) + ')';
  }
  function textoPadraoAT(g) {
    const pn = primeiroNome(g.nome) || primeiroNome(g.handle);
    const mostrados = g.vagas.slice(0, 2).map(descItemAT); const resto = g.vagas.length - mostrados.length;
    const lista = resto > 0 ? mostrados.join(', ') + ' e mais ' + resto : (mostrados.length > 1 ? mostrados.slice(0, -1).join(', ') + ' e ' + mostrados[mostrados.length - 1] : mostrados[0]);
    return 'Oi, ' + pn + '! Aqui é da Dazed CEGs. Você tem ' + pl(g.itens, 'item', 'itens') + ' com pagamento em atraso, no total de ' + brl(g.total) + (g.multa > 0 ? ' com multa' : '') + ': ' + lista + '. Para pagar, pesquise seu @ em dazedcegs.com.br. Qualquer dúvida, é só responder aqui.';
  }

  /* ---- a tela ---- */
  function htmlAtrasosReal() {

      '<div class="cs-campo"><label for="at-contato">Contato</label><select id="at-contato" data-at="contato">' + CONTATOS_AT.map((o) => opcaoSC(o[0], o[1], o[0] === AT.contato)).join('') + '</select></div></div></section>' +

  function htmlChipsAT() {
    const gs = filtradosAT(gruposAT()); const total = gs.reduce((t, g) => t + g.total, 0); const semNum = gs.filter((g) => !temNumeroAT(g)).length;
    const cx = (n, t) => '<div class="at-chip"><strong>' + n + '</strong><span>' + t + '</span></div>';
    return '<div class="at-chips">' + cx(milhar(gs.length), gs.length === 1 ? 'pessoa em atraso' : 'pessoas em atraso') + cx(brl(total), 'total com multa') + cx(milhar(semNum), semNum === 1 ? 'sem número cadastrado' : 'sem número cadastrado') + '</div>';
  }
  function celulaAcaoAT(g) {
    if (!g.handle) {
      const v = g.vagas.find((x) => x.set_id);
      return '<div class="ml-meta">Sem @ anotado: não dá para chamar.</div>' + (v && temPerm(S.sessao, 'anotar_claims') ? '<button type="button" class="sc-mini" data-acao="sc-abrir-vaga" data-id="' + v.id + '">Editar o claim</button>' : '');
    }

      return '<button type="button" class="g-btn at-chamar" data-acao="at-chamar" data-chave="' + esc(g.chave) + '"' + (pode ? '' : ' disabled') + '>' + WA_ICONE + (contatoDe(g) ? 'Chamar de novo' : 'Chamar no WhatsApp') + '</button>' + (pode ? '' : '<div class="ml-meta">Falta a permissão "Ver número completo".</div>');
    }

        if (!r.ok) { toast(msgEV(r, e)); return; }
        abrir(r.dados || {});
      } catch (err) { toast('Não foi possível concluir agora. Tente de novo em instantes.'); }
    });
  }
  function desenharResumoCorrEV() {
    const c = EV.corr; const el = $('#ce-resumo'); if (!c || !el) return;
    const f = erroEnderecoEV(c.f); el.innerHTML = f ? '<p class="cs-nota" style="margin:0">' + esc(f) + '</p>' : '';
    const b = $('#ce-bt'); if (b) b.disabled = !!f;
  }
  function salvarCorrigirEV() {
    const c = EV.corr; if (!c || !$('#ce-resumo')) return; const f = erroEnderecoEV(c.f);
    const erro = (t) => { const x = $('#ce-erro'); if (x) { x.textContent = t; x.hidden = false; } };
    if (f) return erro(f);
    const args = Object.assign({ p_id: c.id }, argsEnderecoEV(c.f)); const b = $('#ce-bt'); if (b) b.disabled = true;
    const limpo = { nome: args.p_nome, rua: args.p_rua, complemento: args.p_complemento || '', bairro: args.p_bairro, cidade: args.p_cidade, uf: args.p_uf, cep: args.p_cep };
    enfileirar(async () => {
      try {
        const r = await rpc('gom_envio_endereco_salvar', args);
        if (!r.ok) { erro(msgEV(r, envioDoEV(c.id))); if (b) b.disabled = false; if (r.erro && String(r.erro.message) === 'estado_invalido') { await recarregarEV(); redesenharAposEV(); } return; }
        fecharModal(); EV.ver = { id: c.id, d: limpo }; clearTimeout(EV.tVer); EV.tVer = setTimeout(esconderEV, TEMPO_ENDERECO_EV);
        if ($('#ev-main')) desenharListaEV(); toast('Endereço corrigido.');
      } catch (err) { erro('Não foi possível concluir agora. Tente de novo em instantes.'); if (b) b.disabled = false; }
    });
  }

  /* ---- WhatsApp: abre a conversa com a mensagem pronta (a ADM revisa e envia). Só mostra o número a quem tem a permissão, e isso fica anotado. ---- */
  function textoWaEV(e) {
    const nome = primeiroNome(e.pessoa_nome) || primeiroNome(e.pessoa_handle); const n = itensTxtEV((e.vagas || []).length); const ini = 'Oi, ' + nome + '! Aqui é da Dazed CEGs. ';
    if (e.estado === 'cotacao') return ini + 'Recebi o seu pedido de envio nacional (' + n + '). Já vou calcular o frete e te aviso o valor.';
    if (e.estado === 'pagamento') return ini + 'O frete do seu envio nacional (' + n + ') ficou em ' + reaisEV(e.frete) + '. Assim que o pagamento for confirmado, a gente embala e envia. Qualquer dúvida, é só responder aqui.';
    if (e.estado === 'embalar') return ini + 'O frete do seu envio nacional foi pago. Estamos embalando ' + n + ' e te avisamos quando for enviado.';
    return ini + 'Seu envio nacional (' + n + ') foi enviado.' + (e.rastreio ? ' Código de rastreio: ' + e.rastreio + '.' : '') + ' Qualquer dúvida, é só responder aqui.';
  }
  function conversarEV(id) {
    const e = envioDoEV(id); if (!e) return; const f = IX.pessoaPorHandle.get(e.pessoa_handle) || null;
    if (!f || f.tem_numero !== true) return toast('@' + e.pessoa_handle + ' ainda não tem número completo cadastrado.');
    const acha = () => $$('[data-acao="ev-wa"]').find((el) => el.getAttribute('data-id') === String(id)); const b = acha(); if (b) b.disabled = true;
    enfileirar(async () => {
      try { await chamarWhatsApp(f.id, 'ver', textoWaEV(e)); }
      catch (err) { toast('Não foi possível concluir agora. Tente de novo em instantes.'); }
      const b2 = acha(); if (b2) b2.disabled = false;
    });
  }

  function acaoEnviosReal(acao, a) {
    const id = parseInt(a.getAttribute('data-id'), 10) || 0;
    switch (acao) {
      case 'ev-aba': EV.aba = a.getAttribute('data-aba'); EV.limite = 30; desenharEV(); return true;
      case 'ev-mais': EV.limite += 30; desenharListaEV(); return true;
      case 'ev-livres-todos': EV.todos = !EV.todos; { const l = $('#ev-livres'); if (l) l.innerHTML = htmlLivresEV(); } return true;
      case 'ev-novo': abrirNovoEV(); return true;
      case 'ev-novo-de': abrirNovoEV(a.getAttribute('data-handle')); return true;
      case 'ev-novo-pessoa': escolherPessoaEV(a.getAttribute('data-handle')); return true;
      case 'ev-novo-trocar': trocarPessoaEV(); return true;
      case 'ev-novo-todos': { const n = EV.novo; const g = n && n.foco ? pessoasLivresEV().find((x) => x.handle === n.foco) : null; if (n && g) { n.vagas = g.vagas.map((v) => v.id); desenharItensEV(); desenharResumoEV(); } return true; }
      case 'ev-novo-nenhum': { const n = EV.novo; if (n) { n.vagas = []; desenharItensEV(); desenharResumoEV(); } return true; }
      case 'ev-novo-ok': criarNovoEV(); return true;
      case 'ev-cotar': cotarEV(id); return true;
      case 'ev-pago': pedirPagoEV(id); return true;
      case 'ev-pago-ok': pagoEV(id); return true;
      case 'ev-voltar': pedirVoltarEV(id); return true;
      case 'ev-voltar-ok': voltarEV(id); return true;
      case 'ev-finalizar': pedirFinalizarEV(id); return true;
      case 'ev-finalizar-ok': finalizarEV(id); return true;
      case 'ev-cancelar': pedirCancelarEV(id); return true;
      case 'ev-cancelar-ok': cancelarEV(id); return true;
      case 'ev-ver': verEnderecoEV(id); return true;
      case 'ev-esconder': esconderEV(); return true;
      case 'ev-copiar-end': copiarEnderecoEV(); return true;
      case 'ev-corrigir-end': abrirCorrigirEV(id); return true;
      case 'ev-corrigir-end-ok': salvarCorrigirEV(); return true;
      case 'ev-wa': conversarEV(id); return true;
      default: return false;
    }
  }
  let tBuscaEV;
  document.addEventListener('input', (e) => {
    const t = e.target; if (!t || !t.getAttribute) return; const k = t.getAttribute('data-ev'); if (!k) return;
    const id = parseInt(t.getAttribute('data-id'), 10) || 0;
    if (k === 'busca') { EV.busca = t.value; EV.limite = 30; clearTimeout(tBuscaEV); tBuscaEV = setTimeout(desenharListaEV, 180); return; }
    if (k === 'frete') { EV.rasc['f' + id] = t.value; const x = $('#ev-e-' + id); if (x) x.hidden = true; return; }
    if (k === 'rastreio') { EV.rasc['r' + id] = t.value; const x = $('#ev-e-' + id); if (x) x.hidden = true; return; }
    if (k === 'n-busca') { const n = EV.novo; if (n && modalNovoAbertoEV()) { n.busca = t.value; desenharAchadosEV(); } return; }
    const m = /^([nc])-(nome|rua|compl|bairro|cidade|cep)$/.exec(k); if (!m) return;
    const alvo = m[1] === 'n' ? EV.novo : EV.corr; if (!alvo) return;
    if (m[2] === 'cep') { const d = soDigitos(t.value).slice(0, 8); const bonito = cepBonitoEV(d); if (t.value !== bonito) t.value = bonito; alvo.f.cep = d; }
    else alvo.f[m[2]] = t.value;
    if (m[1] === 'n') { const x = $('#nv-erro'); if (x) x.hidden = true; desenharResumoEV(); } else { const x = $('#ce-erro'); if (x) x.hidden = true; desenharResumoCorrEV(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target; if (!t || !t.getAttribute) return; const k = t.getAttribute('data-ev'); if (!k) return;
    if (k === 'n-item') {
      const n = EV.novo; if (!n || !modalNovoAbertoEV()) return;
      const id = parseInt(t.value, 10); n.vagas = n.vagas.filter((x) => x !== id); if (t.checked) n.vagas.push(id);
      desenharResumoEV(); return;
    }
    if (k === 'n-uf' || k === 'c-uf') {
      const alvo = k === 'n-uf' ? EV.novo : EV.corr; if (!alvo) return; alvo.f.uf = t.value;
      if (k === 'n-uf') desenharResumoEV(); else desenharResumoCorrEV();
    }
  });
  document.addEventListener('keydown', (e) => {
    const t = e.target; if (!t || !t.getAttribute || e.key !== 'Enter') return; const k = t.getAttribute('data-ev'); if (!k) return;
    const id = parseInt(t.getAttribute('data-id'), 10) || 0;
    if (k === 'frete') { e.preventDefault(); cotarEV(id); } else if (k === 'rastreio') { e.preventDefault(); pedirFinalizarEV(id); }
  });
  Object.assign(window.__real, { EV, estadoNovoEV, filtradosEV, problemasEV, pessoasLivresEV, erroEnderecoEV, textoWaEV, textoEnderecoEV });   /* ganchos de leitura para os testes */

  window.__ir = ir; window.__rota = () => ROTA;

  iniciarPagina();
})();

</script>
