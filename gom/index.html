<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dazed CEGs - GOM</title>
<link rel="icon" type="image/png" href="../imagens/favicon-icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=Josefin+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("dazedcegs_gom_tema")==="escuro")document.documentElement.setAttribute("data-tema","escuro")}catch(e){}</script>
<style>
:root{
  --bg:#E8EFF6; --band:#F1F1F7; --surface:#FFFFFF; --ink:#2B2B33; --muted:#5C6270; --line:rgba(43,43,51,0.10); --field-line:rgba(43,43,51,0.28);
  --primary:#565780; --primary-ink:#4B5078; --on-primary:#FFFFFF; --link:#565780;
  --tint:#F1F1F7; --tint-ink:#4B5078; --track:#E4E6EE;
  --ok-bg:#E1F0E8; --ok-ink:#2A6B4C; --ok-ink2:#2A6B4C;
  --warn-bg:#FBEFD8; --warn-ink:#8A6418; --gray-bg:#F1F1F7; --gray-ink:#5C6270;
  --bad-bg:#FFE3E5; --bad-ink:#C23440; --disabled-bg:#D9DCE6;
  --coral:#FF5460; --coral-dark:#C23440; --purple:#6F70A1; --purple-dark:#565780; --purple-tint:#F1F1F7;
  --shadow:rgba(43,43,51,0.35);
  --foco:#4B5BAD; --nav-bg:#FFFFFF; --nav-linha:#E5E7EB; --nav-txt:#4A5070; --nav-forte:#1F2340; --acento:#4B5BAD; --titulo:#4B5078; --menu-txt:#4A5070;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Poppins','Outfit','Nunito','Inter',-apple-system,sans-serif}
body{font-size:14.5px;line-height:1.55}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}

/* ───── NAVBAR (igual à do site) ───── */
.nav{position:sticky;top:0;z-index:30;background:var(--nav-bg);border-bottom:1px solid var(--nav-linha);display:flex;align-items:center;padding:0 32px;height:64px;gap:0}
.nav-logo{position:absolute;left:32px;display:flex;align-items:center;line-height:1}
.nav-logo img{height:52px;width:auto;display:block}
.nav-links{margin:0 auto;display:flex;align-items:stretch;gap:0}
.nav-a{display:flex;align-items:center;gap:6px;padding:0 18px;height:64px;font-family:'Poppins','Outfit','Nunito','Inter',sans-serif;font-size:13.5px;font-weight:500;color:var(--nav-txt);border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;position:relative}
.nav-a svg{width:16px;height:16px;stroke:var(--nav-txt);fill:none;flex-shrink:0}
.nav-a:hover{color:var(--nav-forte)}
.nav-a.active{color:var(--nav-forte);font-weight:600;border-bottom-color:var(--acento)}
.nav-a.active svg{stroke:var(--nav-forte)}
@media(max-width:1080px){.nav-a span{display:none}}
@media(max-width:680px){.nav{padding:0 16px}.nav-logo{left:16px}.nav-a{padding:0 10px}}

/* ───── página ───── */
.g-main{max-width:1280px;margin:0 auto;padding:36px 32px 90px}
@media(max-width:680px){.g-main{padding:24px 16px 72px}}
.g-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--purple);background:var(--purple-tint);padding:6px 14px;border-radius:999px;margin-bottom:14px;font-weight:600}
.g-muted{color:var(--muted)}
.g-link{color:var(--primary-ink);font-size:13px;font-weight:600;text-decoration:underline}

/* ───── campos e botões (padrão do site: pílulas) ───── */
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=date],input[type=time],input[type=tel],select{width:100%;height:44px;padding:0 16px;border:1px solid var(--field-line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px}
textarea{width:100%;min-height:96px;padding:12px 16px;border:1px solid var(--field-line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:13.5px;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(111,112,161,.15)}
input[type=checkbox],input[type=radio]{accent-color:var(--purple)}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13px;letter-spacing:.2px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.g-btn:hover{background:var(--tint)}
.g-btn.primario{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 14px rgba(255,84,96,.3)}
.g-btn.primario:hover{background:var(--coral-dark);border-color:var(--coral-dark);transform:scale(1.03);box-shadow:0 6px 18px rgba(255,84,96,.38)}
.g-btn.cheio{width:100%}
.g-btn[disabled]{background:var(--disabled-bg);border-color:var(--disabled-bg);color:var(--gray-ink);cursor:not-allowed;box-shadow:none;transform:none}
.g-chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--gray-bg);color:var(--gray-ink);white-space:nowrap}
.g-chip.violeta{background:var(--tint);color:var(--primary-ink)}

/* ───── entrada GOM ───── */
.g-cab{margin-bottom:24px}
.g-cab h1{margin:0 0 8px}
.g-cab p{margin:0 auto;color:var(--muted);font-size:14px;max-width:560px}
.g-login{min-height:calc(100vh - 190px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.g-entrada{display:flex;justify-content:center;width:100%}
.g-entrada .g-card{width:100%;max-width:440px;text-align:left}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 1px 3px rgba(43,43,51,.04);display:flex;flex-direction:column;gap:16px}
.g-card h2{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
.g-card p{margin:0;color:var(--muted);font-size:13.5px}
.g-form{display:flex;flex-direction:column;gap:16px}
.g-campo{display:flex;flex-direction:column;gap:6px}
.g-campo label{font-size:12.5px;font-weight:600;color:var(--muted)}
.g-atalhos{display:flex;flex-direction:column;gap:10px}
.g-card p.g-erro{margin:0;color:var(--coral-dark);font-size:13px;font-weight:600}

/* ───── títulos do painel (mesmo estilo das páginas do site) ───── */
#app h1{font-family:'Note Book','Oswald',sans-serif!important;font-size:28px!important;font-weight:700!important;line-height:1.2!important;letter-spacing:0!important;color:var(--titulo)!important}

/* ───── ajustes das telas para o padrão do site ───── */
#app button[style*="border-radius:8px"],#app a[style*="border-radius:8px"]{border-radius:999px!important}
#app button[style*="background:var(--primary)"],#app a[style*="background:var(--primary)"]{background:var(--coral)!important;border-color:var(--coral)!important;box-shadow:0 4px 14px rgba(255,84,96,.28);font-weight:600!important;letter-spacing:.2px}
#app button[style*="background:var(--primary)"]:hover{background:var(--coral-dark)!important}
#app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=hidden]),#app select{border-radius:999px!important}
#app textarea{border-radius:14px!important}
#app [style*="border-radius:10px"]{border-radius:14px!important}

/* ───── painel ───── */
.g-shell{display:flex;gap:24px;align-items:flex-start}
.g-side{flex:0 0 272px;position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(43,43,51,.04);display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 108px);overflow:auto}
.g-side-topo{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;font-weight:700;font-size:15px;color:var(--titulo)}
.g-menu-btn{display:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13px;cursor:pointer}
.g-lista{display:flex;flex-direction:column;gap:2px}
.g-lista a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:12px;font-size:13.5px;font-weight:500;color:var(--menu-txt);border-left:3px solid transparent}
.g-lista a:hover{background:var(--tint);color:var(--nav-forte)}
.g-lista a[aria-current=page]{background:var(--tint);color:var(--nav-forte);font-weight:600;border-left-color:var(--acento)}
.g-side-rodape{margin-top:8px;padding:14px 10px 4px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--muted)}
.g-side-rodape strong{color:var(--ink);font-size:14px}
.g-side-rodape a,.g-side-rodape button{background:none;border:0;padding:0;color:var(--primary-ink);text-decoration:underline;cursor:pointer;font-size:12.5px;min-height:28px}
.g-content{flex:1 1 0;min-width:0}
.g-content>main{padding:0!important;gap:24px!important}
.g-demo{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 16px;font-size:13px;margin-bottom:22px}
.g-sem-perm{max-width:620px;margin:60px auto;text-align:center}
@media (max-width:900px){
  .g-shell{flex-direction:column;gap:16px}
  .g-side{position:static;flex-basis:auto;width:100%;max-height:none}
  .g-menu-btn{display:inline-flex;align-items:center}
  .g-lista,.g-side-rodape{display:none}
  .g-side.aberto .g-lista{display:flex}
  .g-side.aberto .g-side-rodape{display:block}
}

/* ───── janelas e avisos ───── */
.fundo-modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(43,43,51,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
.modal{width:100%;max-width:580px;background:var(--surface);color:var(--ink);border-radius:18px;padding:26px;margin:auto 0;box-shadow:0 20px 60px var(--shadow);display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:13.5px;max-width:min(560px,calc(100vw - 32px));z-index:60;box-shadow:0 8px 30px var(--shadow)}

/* ───── janelas de nova CEG e novo POB ───── */
.modal h2{margin:0;font-size:20px;color:var(--ink)}
.modal p.g-erro{margin:0;color:var(--coral-dark);font-size:13px;font-weight:600}
.g-acoes{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.g-rotulo{font-size:12.5px;font-weight:600;color:var(--muted)}
.g-check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink)}
.g-check input{width:20px;height:20px}

/* ───── abas da página Sets e claims e etiquetas de estado ───── */
.g-abas{display:flex;flex-wrap:wrap;gap:8px}
.g-aba{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);color:var(--primary-ink);font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s}
.g-aba:hover{background:var(--tint)}
.g-aba[aria-selected=true]{background:var(--tint);border-color:var(--acento);color:var(--nav-forte)}
.g-chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.g-chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.g-chip.bad{background:var(--bad-bg);color:var(--bad-ink)}

/* ───── modo noturno (o botão fica no fim de cada tela do painel) ───── */
html[data-tema="escuro"]{
  --bg:#12141C; --band:#262A3C; --surface:#1D2030; --ink:#ECEDF3; --muted:#A7ACC0; --line:rgba(255,255,255,0.10); --field-line:rgba(255,255,255,0.30);
  --primary:#9A9DDA; --primary-ink:#BFC1F2; --on-primary:#12141C; --link:#BFC1F2;
  --tint:#2A2F47; --tint-ink:#C9CBF5; --track:#353A55;
  --ok-bg:#16382A; --ok-ink:#7FD6A8; --ok-ink2:#7FD6A8;
  --warn-bg:#3B3116; --warn-ink:#F2C879; --gray-bg:#2A2E43; --gray-ink:#B8BCD0;
  --bad-bg:#47202A; --bad-ink:#FF9AA2; --disabled-bg:#3A3F57;
  --purple:#A9ABDF; --purple-dark:#9A9DDA; --purple-tint:#2A2F47;
  --shadow:rgba(0,0,0,0.65);
  --foco:#9EA1F0; --nav-bg:#1A1C28; --nav-linha:rgba(255,255,255,0.10); --nav-txt:#B5B9CE; --nav-forte:#FFFFFF; --acento:#9EA1F0; --titulo:#C9CBF5; --menu-txt:#B5B9CE;
  color-scheme:dark;
}
::placeholder{color:var(--muted);opacity:.75}
.g-fim{display:flex;align-items:center;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.g-switch{position:relative;flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:1px solid var(--field-line);background:var(--track);cursor:pointer;padding:0;transition:background .2s}
.g-switch-bola{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.g-switch[aria-checked=true]{background:var(--acento);border-color:var(--acento)}
.g-switch[aria-checked=true] .g-switch-bola{transform:translateX(20px)}

#app button[disabled]{opacity:.5;cursor:not-allowed}

</style>
</head>

<script>
(function () {
  'use strict';

    const nomes = $$('.g-aba', d).map((b) => b.getAttribute('data-aba'));
    const atual = nomes.includes(aba) ? aba : nomes[0];
    $$('.g-aba', d).forEach((b) => b.setAttribute('aria-selected', b.getAttribute('data-aba') === atual ? 'true' : 'false'));
    $$('[data-painel]', d).forEach((p) => { if (p.getAttribute('data-painel') !== atual) p.hidden = true; });
    return d.innerHTML;
  }

  /* tira da tela os blocos que exigem uma permissão que o perfil não tem */
  function filtrarPermissoes(html, perfil) {
    const d = document.createElement('div'); d.innerHTML = html;
    $$('[data-perm]', d).forEach((el) => { if (!temPerm(perfil, el.getAttribute('data-perm'))) el.remove(); });
    return d.innerHTML;
  }

  function viewPainel(tela, aba) {
    const perfil = S.sessao;
    const permitidas = NAV.filter((n) => temPerm(perfil, n.p));
    const ok = permitidas.some((n) => n.k === tela) && FRAG[tela];
    const lista = permitidas.map((n) => '<a href="#/painel/' + n.k + '"' + (n.k === tela ? ' aria-current="page"' : '') + '>' + icone(n.k) + esc(n.t) + '</a>').join('');
    const outros = Object.keys(PERSONAS).filter((k) => k !== perfil).map((k) => '<button type="button" data-acao="entrar-como" data-perfil="' + k + '">' + esc(PERSONAS[k].nome) + '</button>').join(' · ');
    const lado = '<aside class="g-side" id="lado" aria-label="Menu do painel"><div class="g-side-topo"><span>Painel de controle</span>' +
      '<button type="button" class="g-menu-btn" data-acao="menu" aria-expanded="false">Menu</button></div>' +
      '<nav class="g-lista" aria-label="Telas do painel">' + lista + '</nav>' +
      '<div class="g-side-rodape">Você entrou como<br><strong>' + esc(PERSONAS[perfil].nome) + '</strong><br>' + esc(PERSONAS[perfil].acesso) +
      (perfil !== 'admin' ? '<br>O que você pode fazer é definido pela administradora.' : '') +
      '<br><br>Trocar de perfil (demonstração):<br>' + outros +
      '<br><button type="button" data-acao="sair">Sair</button></div></aside>';
    const corpo = ok ? FRAG[tela] : '';
    const conteudo = ok ? (tela === 'sets' || tela === 'frete' ? prepararAbas(corpo, perfil, aba) : (tela === 'inicio' ? filtrarPermissoes(corpo, perfil) : corpo)) :
      '<div class="g-sem-perm"><h1>Sem permissão para esta tela</h1><p class="g-muted">' + esc(PERSONAS[perfil].nome) + ' não tem essa permissão. A administradora pode liberar na tela Permissões.</p>' +
      '<p><a class="g-btn primario" href="#/painel/' + telaInicial(perfil) + '">Ir para o início</a></p></div>';
    return '<div class="g-shell">' + lado + '<div class="g-content"><div class="g-demo">Painel de demonstração com dados de exemplo. Os botões ainda não gravam nada.</div>' + conteudo + fimDaPagina() + '</div></div>';
  }


  /* ------------------------------------------------ interações do painel */
  const CHAVES = { 'Anotar claims': 'anotar_claims', 'Criar sets': 'criar_sets', 'Fotos do POB': 'fotos_pob', 'Cadastros Joiners': 'cadastro_pessoas', 'Ver número completo': 'ver_numero_completo', 'Pagamentos em atraso': 'pagamentos_atraso', 'Repasses': 'pedidos_repasse', 'Frete e taxa': 'frete_taxa', 'Liberar pagamento': 'liberar_pagamento', 'Prazo, multa e valor': 'prazo_multa_valor', 'Marcar ou desfazer pago, estornar': 'marcar_pago_estornar', 'Usuários e permissões': 'usuarios_permissoes' };
  function ligarPermissoes() {
    $$('input[type=checkbox][aria-label]').forEach((cb) => {
      const rot = cb.getAttribute('aria-label'); const i = rot.lastIndexOf(', ');
      const chave = CHAVES[rot.slice(0, i)]; const quem = rot.slice(i + 2).toLowerCase();
      if (!chave || (quem !== 'bruna' && quem !== 'esther')) return;
      if (!cb.disabled) cb.checked = !!S.perms[quem][chave];
      cb.addEventListener('change', () => { S.perms[quem][chave] = cb.checked; salvar(); toast('Permissão ' + (cb.checked ? 'liberada' : 'retirada') + ' para ' + PERSONAS[quem].nome + ': ' + rot.slice(0, i) + '.'); });
    });
  }
  function ligarCriarSets() {
    if (S.sessao !== 'admin') { const b = $('#btn-nova-ceg'); if (b) b.remove(); }
    iniciarCegPob();
    const q = $('#c-qtd'); if (!q) return;
    const atualizar = () => {
      if (!(cegAtual && pobAtual)) { estadoCriarSets(); return; }
      const n = Math.max(1, parseInt(q.value, 10) || 1);
      const vagas = $$('button[aria-label^="Remover "]').length || 6;
      const val = ($('#c-valor') || {}).value || '0,00'; const prazo = ($('#c-prazo') || {}).value || ''; const hora = ($('#c-hora') || {}).value || '12:00'; const multa = ($('#c-multa') || {}).value || '0,00';
      const forte = $$('strong').find((s) => /^(Vai criar do Set|Escolha a CEG)/.test(s.textContent));
      if (forte && forte.parentElement) forte.parentElement.innerHTML = '<strong style="font-weight:700">Vai criar do Set 13 ao Set ' + (12 + n) + '.</strong><br> ' + vagas + ' vagas por set, ' + (vagas * n) + ' vagas no total, todas livres. Cada vaga custa R$ ' + esc(val) + ', com prazo em ' + esc(prazo) + ' às ' + esc(hora) + ' e multa de R$ ' + esc(multa) + ' por dia. A numeração continua sozinha a partir do último set do POB.';
      const b = $$('button').find((x) => /^Criar \d+ sets?$/.test(x.textContent.trim()));
      if (b) b.textContent = 'Criar ' + n + (n === 1 ? ' set' : ' sets');
    };
    ['#c-qtd', '#c-valor', '#c-prazo', '#c-hora', '#c-multa'].forEach((id) => { const el = $(id); if (el) el.addEventListener('input', atualizar); });
  }
  function botaoPainel(b) {
    const t = b.textContent.replace(/\s+/g, ' ').trim();
    if (b.closest('.fundo-modal')) {
      if (/^Cancelar$/.test(t)) return fecharModal();
      if (/^Criar CEG$/.test(t)) return confirmarNovaCeg();
      if (/^Criar POB$/.test(t)) return confirmarNovoPob();
      if (/^Criar login$/.test(t)) return confirmarNovoLogin();
      if (/^Criar cadastro e vincular/.test(t)) { fecharModal(); return toast('Cadastro criado e vinculado (demonstração).'); }
      return toast('"' + t + '": demonstração, ainda não grava nada.');
    }
    if (/^Adicionar CEG nova$/.test(t)) return abrirNovaCeg();
    if (/^Adicionar POB novo$/.test(t)) return abrirNovoPob();
    if (/^Criar login$/.test(t)) return abrirNovoLogin();
    if (/^Criar cadastro$/.test(t)) return abrirModal(FRAG._dialogo_cadastro);
    if (/WhatsApp/.test(t)) return toast('Abriria o WhatsApp com a mensagem pronta (demonstração).');
    if (/^Desfazer/.test(t)) return toast('Desfeito (demonstração).');
    if (/^Criar \d+ sets?$/.test(t)) return toast('Criaria os sets em rascunho (demonstração).');
    if (/^Salvar permissões/.test(t)) return toast('As permissões já valem na hora, ao marcar e desmarcar (demonstração).');
    toast('"' + t + '": botão de demonstração, ainda não grava nada.');
  }

  /* ------------------------------------------------ CEGs e POBs da tela Criar sets (demonstração) */
  /* cada POB pertence a uma CEG; o mesmo nome pode existir em CEGs diferentes */
  const CEGS_POBS = {
    'POBS THE SIN: Bliss': ['KTOWN4U LD R2', 'GS25', 'MUSINSA', 'WEVERSE GLOBAL'],
    'Death of Me Pobs': ['MUSINSA', 'WEVERSE GLOBAL']
  };
  let cegAtual = ''; let pobAtual = '';   /* começam no traço: nada vem escolhido */
  function popularCegs() {
    const sel = $('#c-ceg'); if (!sel) return;
    sel.innerHTML = '<option value="">—</option>' + Object.keys(CEGS_POBS).map((n) => '<option>' + esc(n) + '</option>').join('');
    sel.value = cegAtual;
  }
  function popularPobs() {
    const sel = $('#c-pob'); if (!sel) return;
    if (!cegAtual) { sel.innerHTML = '<option value="" selected>—</option>'; sel.disabled = true; pobAtual = ''; estadoCriarSets(); return; }
    sel.disabled = false;
    const lista = CEGS_POBS[cegAtual] || [];
    if (!lista.length) { sel.innerHTML = '<option value="" disabled selected>Crie o primeiro POB desta CEG</option>'; pobAtual = ''; estadoCriarSets(); return; }
    sel.innerHTML = '<option value="">—</option>' + lista.map((n) => '<option>' + esc(n) + '</option>').join('');
    if (!lista.includes(pobAtual)) pobAtual = '';
    sel.value = pobAtual;
    estadoCriarSets();
  }
  /* sem CEG e POB escolhidos, não dá para criar sets: o botão fica desativado e o resumo pede a escolha */
  function estadoCriarSets() {
    const campoQtd = $('#c-qtd'); if (!campoQtd) return;
    const pronto = !!(cegAtual && pobAtual);
    $$('button').filter((x) => /^Criar \d+ sets?$/.test(x.textContent.trim()) || /^Duplicar o Set/.test(x.textContent.trim())).forEach((x) => { x.disabled = !pronto; });
    if (!pronto) {
      const forte = $$('strong').find((x) => /^(Vai criar do Set|Escolha a CEG)/.test(x.textContent));
      if (forte && forte.parentElement) forte.parentElement.innerHTML = '<strong style="font-weight:700">Escolha a CEG e o POB.</strong><br> O resumo dos sets aparece aqui antes de criar.';
    } else { campoQtd.dispatchEvent(new Event('input', { bubbles: true })); }
  }
  function iniciarCegPob() {
    popularCegs(); popularPobs();
    const c = $('#c-ceg'); const p = $('#c-pob');
    if (c) c.addEventListener('change', () => { cegAtual = c.value; pobAtual = ''; popularPobs(); });
    if (p) p.addEventListener('change', () => { pobAtual = p.value; estadoCriarSets(); });
  }
  function erroModal(msg) { const x = $('#m-erro'); if (x) { x.textContent = msg; x.hidden = false; } }
  function nomeLimpo(id) { const c = $(id); return ((c && c.value) || '').replace(/\s+/g, ' ').trim(); }
  function enterConfirma(id, fn) { const c = $(id); if (c) c.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); fn(); } }); }
  const BOTOES_MODAL = '<div class="g-acoes"><button type="button" class="g-btn">Cancelar</button><button type="button" class="g-btn primario">@@OK@@</button></div>';
  function abrirNovaCeg() {
    abrirModal('<h2>Nova CEG</h2>' +
      '<div class="g-campo"><label for="m-ceg-nome">Nome da CEG</label><input id="m-ceg-nome" type="text" placeholder="Ex.: POBS THE SIN: Bliss" autocomplete="off"></div>' +
      '<p class="g-erro" id="m-erro" role="alert" hidden></p>' + BOTOES_MODAL.replace('@@OK@@', 'Criar CEG'));
    enterConfirma('#m-ceg-nome', confirmarNovaCeg);
  }
  function confirmarNovaCeg() {
    const nome = nomeLimpo('#m-ceg-nome');
    if (!nome) return erroModal('Digite o nome da CEG.');
    if (Object.keys(CEGS_POBS).some((n) => n.toLowerCase() === nome.toLowerCase())) return erroModal('Já existe uma CEG com esse nome.');
    CEGS_POBS[nome] = []; cegAtual = nome; pobAtual = '';
    popularCegs(); popularPobs();
    fecharModal();
    toast('CEG "' + nome + '" criada. Agora adicione o primeiro POB (demonstração).');
  }
  function abrirNovoPob() {
    const opcoes = '<option value=""' + (cegAtual ? '' : ' selected') + '>—</option>' + Object.keys(CEGS_POBS).map((n) => '<option' + (n === cegAtual ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
    abrirModal('<h2>Novo POB</h2>' +
      '<div class="g-campo"><label for="m-pob-nome">Nome do POB</label><input id="m-pob-nome" type="text" placeholder="Ex.: WEVERSE GLOBAL" autocomplete="off"></div>' +
      '<div class="g-campo"><label for="m-pob-ceg">Vincular à CEG</label><select id="m-pob-ceg">' + opcoes + '</select></div>' +
      '<p class="g-erro" id="m-erro" role="alert" hidden></p>' + BOTOES_MODAL.replace('@@OK@@', 'Criar POB'));
    enterConfirma('#m-pob-nome', confirmarNovoPob);
  }
  function confirmarNovoPob() {
    const nome = nomeLimpo('#m-pob-nome'); const ceg = ($('#m-pob-ceg') || {}).value || '';
    if (!nome) return erroModal('Digite o nome do POB.');
    if (!CEGS_POBS[ceg]) return erroModal('Escolha a CEG do POB.');
    if (CEGS_POBS[ceg].some((n) => n.toLowerCase() === nome.toLowerCase())) return erroModal('Já existe um POB com esse nome nesta CEG.');
    CEGS_POBS[ceg].push(nome); cegAtual = ceg; pobAtual = nome;
    popularCegs(); popularPobs();
    fecharModal();
    toast('POB "' + nome + '" criado na CEG "' + ceg + '" (demonstração).');
  }



  /* ------------------------------------------------ tela Usuários (demonstração): criar login e visão geral */
  const USUARIOS_CRIADOS = [];
  const linhasUsuarios = () => $$('[role=table][aria-label="Usuários do painel"] [role=row]').slice(1);
  function atualizarResumoUsuarios() {
    const alvo = $('#u-resumo'); if (!alvo) return;
    const linhas = linhasUsuarios();
    const estado = (l) => ((($$('[role=cell]', l)[2]) || {}).textContent || '').trim();
    const ativos = linhas.filter((l) => /^Ativa/.test(estado(l))).length;
    const pendentes = linhas.filter((l) => /Convite/.test(estado(l))).length;
    const bloqueados = linhas.filter((l) => /Bloquead/.test(estado(l))).length;
    const c = (t, cls) => '<span class="g-chip' + (cls ? ' ' + cls : '') + '">' + t + '</span>';
    alvo.innerHTML = c(linhas.length + (linhas.length === 1 ? ' login' : ' logins')) +
      c(ativos + (ativos === 1 ? ' ativo' : ' ativos'), 'ok') +
      c(pendentes + (pendentes === 1 ? ' convite pendente' : ' convites pendentes'), pendentes ? 'warn' : '') +
      c(bloqueados + (bloqueados === 1 ? ' bloqueado' : ' bloqueados'), bloqueados ? 'bad' : '');
  }
  function adicionarLinhaUsuario(u) {
    const linhas = linhasUsuarios(); const modelo = linhas[linhas.length - 1]; if (!modelo) return;
    const novo = modelo.cloneNode(true); const cel = $$('[role=cell]', novo);
    cel[0].innerHTML = '<strong>' + esc(u.nome) + '</strong>'; cel[1].textContent = 'ADM';
    cel[2].innerHTML = '<span style="display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--warn-bg);color:var(--warn-ink)">Convite enviado</span>';
    cel[3].textContent = 'ainda não entrou';
    modelo.parentNode.appendChild(novo);
  }
  function ligarUsuarios() { USUARIOS_CRIADOS.forEach(adicionarLinhaUsuario); atualizarResumoUsuarios(); }
  function abrirNovoLogin() {
    abrirModal('<h2>Criar login</h2>' +
      '<div class="g-campo"><label for="m-lg-nome">Nome</label><input id="m-lg-nome" type="text" placeholder="Ex.: Camila" autocomplete="off"></div>' +
      '<div class="g-campo"><label for="m-lg-mail">E-mail</label><input id="m-lg-mail" type="email" placeholder="nome@email.com" autocomplete="off"></div>' +
      '<p class="g-muted" style="margin:0;font-size:13px">A pessoa recebe um e-mail para criar a senha e ativar a verificação em duas etapas. Ela vê todas as CEGs, e o que pode fazer você define em Permissões.</p>' +
      '<p class="g-erro" id="m-erro" role="alert" hidden></p>' + BOTOES_MODAL.replace('@@OK@@', 'Criar login'));
    enterConfirma('#m-lg-mail', confirmarNovoLogin);
  }
  function confirmarNovoLogin() {
    const nome = nomeLimpo('#m-lg-nome'); const mail = ((($('#m-lg-mail') || {}).value) || '').trim().toLowerCase();
    if (!nome) return erroModal('Digite o nome.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return erroModal('Digite um e-mail válido.');
    if (USUARIOS_CRIADOS.some((u) => u.mail === mail)) return erroModal('Já existe um login com esse e-mail.');
    const u = { nome, mail };
    USUARIOS_CRIADOS.push(u); adicionarLinhaUsuario(u); atualizarResumoUsuarios(); fecharModal();
    toast('Login criado para ' + nome + '. O convite foi enviado para ' + mail + ' (demonstração).');
  }



  /* ------------------------------------------------ modo noturno (vale para o painel inteiro, a escolha fica guardada) */
  const CHAVE_TEMA = 'dazedcegs_gom_tema';
  const temaEscuro = () => document.documentElement.getAttribute('data-tema') === 'escuro';
  function aplicarTema(escuro, guardar) {
    if (escuro) document.documentElement.setAttribute('data-tema', 'escuro'); else document.documentElement.removeAttribute('data-tema');
    $$('[data-acao="tema"]').forEach((b) => b.setAttribute('aria-checked', escuro ? 'true' : 'false'));
    if (guardar) { try { localStorage.setItem(CHAVE_TEMA, escuro ? 'escuro' : 'claro'); } catch (e) { /* ignora */ } }
  }
  try { if (localStorage.getItem(CHAVE_TEMA) === 'escuro') document.documentElement.setAttribute('data-tema', 'escuro'); } catch (e) { /* ignora */ }
  const fimDaPagina = () => '<footer class="g-fim"><button type="button" class="g-switch" role="switch" aria-checked="' + (temaEscuro() ? 'true' : 'false') + '" aria-label="Modo noturno" data-acao="tema"><span class="g-switch-bola"></span></button><span>Modo noturno</span></footer>';



  /* ------------------------------------------------ rotas */
  let ROTA = '/gom';
  try { if (location.hash && location.hash.length > 1) ROTA = location.hash.slice(1); } catch (e) { /* ignora */ }
  const rota = () => ROTA.split('/').filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const marcarEndereco = () => { try { if (location.hash !== '#' + ROTA) history.replaceState(null, '', '#' + ROTA); } catch (e) { /* ignora */ } };
  /* endereços antigos continuam funcionando e levam para a tela nova */
  const ALIAS = { 'criar-sets': ['sets', 'criar'], 'claims': ['sets', 'anotar'], 'claims-editar': ['sets', 'editar'], 'fotos': ['sets', 'fotos'], 'prazo-multa': ['sets', 'criar'], 'frete-lancar': ['importar'] };
  function trocarAba(nome, tela) {
    const raiz = $('.g-content'); if (!raiz) return;
    const dela = (el) => (el.getAttribute('data-tela') || 'sets') === tela;
    $$('.g-aba', raiz).filter(dela).forEach((b) => b.setAttribute('aria-selected', b.getAttribute('data-aba') === nome ? 'true' : 'false'));
    $$('[data-painel]', raiz).filter(dela).forEach((x) => { x.hidden = x.getAttribute('data-painel') !== nome; });
    ROTA = '/painel/' + tela + '/' + nome; marcarEndereco();
  }
  function ir(caminho) { ROTA = String(caminho || '/gom').replace(/^#/, '') || '/gom'; render(); }
  function render() {
    fecharModal();
    const p = rota(); let html = ''; let titulo = 'Dazed CEGs - GOM';
    if (p[0] === 'painel') {
      if (!S.sessao) { ROTA = '/gom'; return render(); }
      if (!p[1]) { ROTA = '/painel/' + telaInicial(S.sessao); return render(); }
      if (ALIAS[p[1]]) { ROTA = '/painel/' + ALIAS[p[1]].join('/'); return render(); }
      html = viewPainel(p[1], p[2]); titulo = 'Dazed CEGs - Painel de controle';
    } else {
      if (S.sessao) { ROTA = '/painel/' + telaInicial(S.sessao); return render(); }
      html = viewGom();
    }
    app.innerHTML = html;
    document.title = titulo;
    if (p[1] === 'sets' || p[1] === 'frete') { const sel = $('.g-aba[aria-selected="true"]'); if (sel) ROTA = '/painel/' + p[1] + '/' + sel.getAttribute('data-aba'); }
    marcarEndereco();
    const subir = () => { try { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (e) { /* ignora */ } };
    subir(); requestAnimationFrame(subir); setTimeout(subir, 80);
    if (p[0] === 'painel') { if (p[1] === 'permissoes') ligarPermissoes(); if (p[1] === 'sets') ligarCriarSets(); if (p[1] === 'usuarios') ligarUsuarios(); }
  }

  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#/"]');
    if (link) { e.preventDefault(); ir(link.getAttribute('href').slice(1)); return; }
    const a = e.target.closest('[data-acao]');
    if (a) {
      const acao = a.getAttribute('data-acao');
      if (acao === 'fechar') fecharModal();
      else if (acao === 'menu') { const l = $('#lado'); if (l) { l.classList.toggle('aberto'); a.setAttribute('aria-expanded', l.classList.contains('aberto') ? 'true' : 'false'); } }
      else if (acao === 'tema') aplicarTema(!temaEscuro(), true);
      else if (acao === 'aba') trocarAba(a.getAttribute('data-aba'), a.getAttribute('data-tela') || 'sets');
      else if (acao === 'sair') { S.sessao = null; salvar(); passoLogin = 1; ir('/gom'); }
      else if (acao === 'entrar-como') {
        S.sessao = a.getAttribute('data-perfil'); salvar(); passoLogin = 1;
        ir('/painel/' + telaInicial(S.sessao));
      }
      return;
    }
    const b = e.target.closest('button');
    if (b && !b.disabled && (b.closest('.g-content') || b.closest('.fundo-modal'))) {
      if (b.closest('.fundo-modal') && b.hasAttribute('data-acao')) return;
      botaoPainel(b);
    }
  });
  const erroLogin = (msg) => { const m = $('#g-erro'); if (m) { m.textContent = msg; m.hidden = false; } };
  document.addEventListener('submit', (e) => {
    const f = e.target;
    if (!f || !f.id) return;
    e.preventDefault();
    if (f.id === 'form-gom-1') {
      const mail = ($('#g-email').value || '').trim().toLowerCase(); const senha = $('#g-senha').value || '';
      if (!mail || !senha) return erroLogin('Digite o e-mail e a senha.');
      emailLogin = mail; passoLogin = 2; render();
    } else if (f.id === 'form-gom-2') {
      if (!/^\d{6}$/.test(($('#g-codigo').value || '').trim())) return erroLogin('Digite os 6 números do código.');
      S.sessao = /bruna/.test(emailLogin) ? 'bruna' : /esther/.test(emailLogin) ? 'esther' : 'admin';
      salvar(); passoLogin = 1; ir('/painel/' + telaInicial(S.sessao));
    }
  });
  window.__ir = ir; window.__rota = () => ROTA;

  render();
})();

</script>
</body>
</html>
